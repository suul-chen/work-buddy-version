<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校招项目全周期工作台</title>
<style>
:root{
  --bg:#efeae0; --panel:#ffffff; --ink:#0a0a0a; --sub:#6b6358;
  --line:#d9d3c4; --line2:#0a0a0a;
  --accent:#e63946; --accent2:#1d3557;
  --warm1:#ff8a3d; --warm2:#f25c1d;
  --cool1:#4dd0e1; --cool2:#06b6d4;
  --early:#facc15; --late:#3b82f6; --ontime:#9ca3af;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* sidebar */
.sidebar{width:240px;background:#0a0a0a;color:#f5f5f5;padding:24px 0;flex:0 0 240px;display:flex;flex-direction:column}
.brand{padding:0 24px 20px;color:#fff;border-bottom:1px solid #1f1f1f;margin-bottom:14px}
.brand .mark{font-weight:900;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .mark::before{content:'';width:12px;height:12px;background:var(--accent);display:inline-block}
.brand .sub{font-weight:400;font-size:10px;letter-spacing:2px;color:#999;margin-top:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 24px;color:#cfcfcf;text-decoration:none;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.3px;transition:background .18s ease,color .18s ease,padding-left .18s ease}
.nav a:hover{background:#161616;color:#fff;padding-left:28px}
.nav a.active{background:#fff;color:#0a0a0a;position:relative}
.nav a.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.nav .num{font-size:10px;color:#666;font-weight:800;width:22px;letter-spacing:1px}
.nav a.active .num{color:var(--accent)}
.subnav{list-style:none;margin:0;padding:6px 0;background:#050505;overflow:hidden;max-height:0;transition:max-height .3s ease}
.subnav:not(.hidden){max-height:400px}
.subnav li{padding:9px 24px 9px 52px;color:#888;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s,padding-left .15s}
.subnav li:hover{background:#111;color:#eee;padding-left:58px}
.subnav li.active{color:#fff;background:#0e0e0e}
.subnav li.active::before{content:'';width:6px;height:6px;background:var(--accent);margin-right:2px;display:inline-block}
.subnav li .grip{color:#555;cursor:grab;margin-left:-26px;font-size:14px}
.sidebar-foot{margin-top:auto;padding:18px 24px;border-top:1px solid #1a1a1a;font-size:10px;color:#666;letter-spacing:2px;font-weight:700}

/* main / page header */
main{flex:1;padding:36px 48px 56px;overflow:auto;max-width:100%}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.page-header .ph-issue{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--accent);margin-bottom:10px;text-transform:uppercase}
.page-header .ph-title{font-size:56px;line-height:1;font-weight:900;margin:0 0 10px;letter-spacing:-1px;color:var(--ink)}
.page-header .ph-meta{font-size:12px;color:var(--sub);letter-spacing:.5px}
.page-header .ph-right{text-align:right}
.page-header .ph-num{font-size:56px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-2px}
.page-header .ph-mark{font-size:14px;color:var(--ink);margin-top:6px;font-weight:800;letter-spacing:2px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;margin-bottom:18px;position:relative;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
.section-h{font-weight:800;margin:0 0 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.section-h::before{content:'';width:10px;height:10px;background:var(--accent)}
.muted{color:var(--sub);font-size:12px}
.hint{font-size:12px;color:var(--sub);margin:6px 0;letter-spacing:.3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* quick entry */
.quick{display:flex;gap:10px;align-items:stretch}
.quick textarea{flex:1;height:68px;border:2px solid var(--ink);padding:12px 14px;font-size:14px;resize:none;font-family:inherit;background:#fff;transition:box-shadow .2s}
.quick textarea:focus{outline:0;box-shadow:5px 5px 0 var(--accent)}

/* buttons */
.btn{background:var(--ink);color:#fff;border:0;padding:10px 18px;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:1px;font-family:inherit;text-transform:uppercase;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.btn:hover{transform:translate(-1px,-2px);box-shadow:3px 3px 0 var(--accent)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.ok,.btn.warn{background:var(--accent);color:#fff;border:2px solid var(--accent)}
.btn.ok:hover,.btn.warn:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:6px 12px;font-size:10px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--ink);margin-bottom:18px;background:#fff}
.metric{padding:18px 20px;border-right:1px solid var(--ink);position:relative;background:#fff;transition:background .2s}
.metric:last-child{border-right:0}
.metric:hover{background:#fafaf6}
.metric .n{font-size:38px;font-weight:900;line-height:1;letter-spacing:-1px}
.metric .l{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);margin-top:8px;text-transform:uppercase}
.metric .acc{position:absolute;top:14px;right:14px;width:8px;height:8px;background:var(--accent)}
.metric.wide{grid-column:span 4;border-top:1px solid var(--ink);background:#0a0a0a;color:#fff}
.metric.wide .n{color:var(--accent)}
.metric.wide .l{color:#aaa}

/* timeline */
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:14px;align-items:flex-start}
ul.tl li:last-child{border-bottom:0}
ul.tl li .ts{color:var(--sub);font-size:11px;min-width:110px;font-weight:800;letter-spacing:1px}

/* pills */
.pill{display:inline-block;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:1px;border:1.5px solid var(--ink);background:#fff;margin-right:4px;text-transform:uppercase}
.pill.acc{border-color:var(--accent);color:var(--accent)}
.pill.ghost{border-color:var(--line);color:var(--sub)}
.st-未完成{border-color:var(--ink);color:var(--ink)}
.st-正在进行{background:var(--ink);color:#fff;border-color:var(--ink)}
.st-已交付{background:var(--accent);color:#fff;border-color:var(--accent)}

/* filter bar */
.filterbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:#fff;border:2px solid var(--ink);padding:16px 16px 16px 110px;margin-bottom:16px;position:relative}
.filterbar::before{content:'FILTERS';position:absolute;top:-2px;left:-2px;background:var(--ink);color:#fff;font-size:10px;letter-spacing:3px;padding:6px 10px;font-weight:800}
.filterbar .fl{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.filterbar select,.filterbar input[type=date]{border:2px solid var(--ink);padding:6px 10px;font-size:12px;font-family:inherit;background:#fff;border-radius:0}
.filterbar .sortbtn{cursor:pointer;border:2px solid var(--ink);padding:6px 12px;background:#fff;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:all .15s;font-family:inherit}
.filterbar .sortbtn:hover{background:var(--ink);color:#fff;transform:translate(-1px,-2px);box-shadow:3px 3px 0 var(--accent)}

/* table */
table.board{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink);font-size:12.5px;margin-bottom:16px}
table.board th,table.board td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
table.board thead th{border-bottom:2px solid var(--ink);font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase;background:#fafaf6}
table.board tbody tr{transition:background .12s}
table.board tbody tr:hover{background:#fff8f5}

/* progress */
.prog{height:8px;background:var(--line);width:96px;position:relative;overflow:hidden;border:1px solid var(--ink)}
.prog>i{display:block;height:100%;background:var(--ink);width:0;animation:progGrow .75s ease-out forwards;transform-origin:left}
@keyframes progGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* gantt */
.gtitle{font-size:11px;letter-spacing:2px;font-weight:800;margin:16px 0 6px;text-transform:uppercase;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.gdot{width:14px;height:14px;display:inline-block}
.gdot.gwarm{background:var(--accent)}
.gdot.gcool{background:var(--ink)}
.gtask{display:grid;grid-template-columns:140px 1fr 96px;align-items:center;gap:12px;margin:4px 0;font-size:12px;padding:6px 0;transition:background .15s}
.gtask:hover{background:#fafaf6}
.gtrack{position:relative;height:22px;background:#f3efe7;border:1.5px solid var(--ink);overflow:hidden}
.gbar{position:absolute;top:2px;height:16px;transform:scaleX(0);transform-origin:left;animation:barGrow .8s ease-out forwards}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gwarm{background:var(--accent)}
.gcool{background:var(--ink)}
.gbadge{font-size:10px;font-weight:800;padding:3px 8px;letter-spacing:1px;white-space:nowrap;text-align:center;text-transform:uppercase;border:1.5px solid var(--ink);background:#fff}
.b-y{background:var(--early);color:var(--ink);border-color:var(--ink)}
.b-b{background:var(--late);color:#fff;border-color:var(--ink)}
.b-g{background:#fff;color:var(--sub)}
.gscale{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-left:158px;letter-spacing:2px;font-weight:800;margin-top:4px;text-transform:uppercase}

/* tabs */
.tabs{display:inline-flex;border:2px solid var(--ink);margin-bottom:14px;overflow:hidden}
.tabs button{padding:7px 16px;background:#fff;color:var(--ink);border:0;border-right:2px solid var(--ink);cursor:pointer;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:background .15s,color .15s;font-family:inherit}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:#fafaf6}
.tabs button.on{background:var(--ink);color:#fff}

/* inputs / modal */
textarea.edit{width:100%;border:2px solid var(--ink);padding:10px;font-family:inherit;font-size:13px;resize:vertical;border-radius:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);margin-bottom:5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--ink);padding:8px 10px;font-size:13px;font-family:inherit;border-radius:0;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;box-shadow:4px 4px 0 var(--accent)}
.field .req{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal-bg.show{display:flex;animation:fadeIn .2s ease}
.modal{background:#fff;border:2px solid var(--ink);padding:24px;width:600px;max-width:100%;position:relative;animation:modalIn .28s ease;box-shadow:8px 8px 0 var(--accent)}
.modal::before{content:'';position:absolute;top:-2px;left:-2px;width:48px;height:6px;background:var(--accent)}
.modal h3{margin:0 0 16px;font-size:22px;letter-spacing:-.5px;font-weight:900}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}

/* route transition */
#main > *{animation:viewEnter .34s ease-out both}
@keyframes viewEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* misc */
.day-group{margin-bottom:18px;border-left:3px solid var(--ink);padding:6px 0 6px 14px;background:#fff}
.day-group .dh{font-weight:900;font-size:13px;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.day-group .dh::before{content:'◆';color:var(--accent);font-size:14px}
.ov-todo li b{color:var(--accent)}
.deco{display:flex;align-items:center;gap:10px;margin:10px 0 16px;color:var(--sub);font-size:11px;letter-spacing:3px;font-weight:800;text-transform:uppercase}
.deco::before,.deco::after{content:'';flex:1;border-top:2px solid var(--ink)}
.deco span{color:var(--accent)}


/* project picker */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-bottom:18px}
.proj-card{background:#fff;border:2px solid var(--ink);padding:20px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;position:relative;overflow:hidden}
.proj-card::before{content:'';position:absolute;top:-2px;left:-2px;width:42px;height:6px;background:var(--accent)}
.proj-card:hover{transform:translate(-2px,-3px);box-shadow:5px 5px 0 var(--accent)}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.pc-name{font-size:22px;font-weight:900;letter-spacing:-.5px}
.pc-num{font-size:34px;font-weight:900;color:var(--accent);line-height:1}
.pc-bar{height:10px;background:var(--line);border:1px solid var(--ink);margin:10px 0;overflow:hidden}
.pc-bar>i{display:block;height:100%;background:var(--ink);width:0;animation:progGrow .8s ease-out forwards;transform-origin:left}
.pc-meta{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--sub);text-transform:uppercase}
.pc-go{margin-top:12px;font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--ink)}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">校招 · WORKBENCH</div><div class="sub">CAMPUS RECRUIT · FULL CYCLE</div></div>
    <nav class="nav" id="nav">
      <a data-route="overview" class="active"><span class="num">01</span>概况</a>
      <a data-route="roadmap" id="navRoadmap"><span class="num">02</span>Roadmap</a>
      <ul class="subnav hidden" id="projectList"></ul>
      <a data-route="files"><span class="num">03</span>文件库</a>
      <a data-route="notes"><span class="num">04</span>碎碎念</a>
      <a data-route="logs"><span class="num">05</span>工作日志</a>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============ 常量 ============ */
const TYPES = ['调研类','文案撰写类','文案宣传类','设计类','执行协调类','其他'];
const STATUSES = ['未完成','正在进行','已交付'];
const OWNER_DEFAULT = '陈世维';
const YEAR = 2026;

/* ============ 状态 ============ */
let state = null;
const LS_KEY = 'campus_workbench_v1';

function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ state = JSON.parse(raw); normalize(); return; }catch(e){} }
  state = seed();
  save();
}
function normalize(){
  if(!Array.isArray(state.files)) state.files = [];
  if(!state.fileFilters) state.fileFilters = {project:'all',type:'all',asc:true};
  if(!state.filters) state.filters = {type:'all',dueBefore:'',status:'all',cycle:'all'};
  if(!state.projectOrder) state.projectOrder = [];
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ============ 种子数据（按照片字段：招商局 / 特发集团） ============ */
function seed(){
  const t = (o)=>Object.assign({id:uid(),cycle:'7.6-7.10【第一周】',progress:0,deliverable:'',related:'',difficulty:'',owner:OWNER_DEFAULT,parent:'',status:'未完成',createdAt:nowISO(),updatedAt:nowISO()}, o);
  const tasks = [
    t({content:'完成磷酸铁锂电池行业研究报告',type:'调研类',project:'招商局',start:'2026-07-06',due:'2026-07-10',actual:'2026-07-09',progress:100,deliverable:'行业研究报告PPT',difficulty:'一手数据难获取→已联系学长',status:'已交付'}),
    t({content:'整理招商局面试话术',type:'文案撰写类',project:'招商局',start:'2026-07-08',due:'2026-07-12',actual:'2026-07-14',progress:100,deliverable:'面试话术文档',difficulty:'表达不流畅→多次录音复盘',status:'已交付'}),
    t({content:'招商局终面PPT制作',type:'设计类',project:'招商局',start:'2026-07-15',due:'2026-07-20',progress:60,deliverable:'终面PPT',difficulty:'排版耗时→套用模板',status:'正在进行'}),
    t({content:'招商局宣讲会物料设计',type:'文案宣传类',project:'招商局',start:'2026-07-18',due:'2026-07-25',progress:40,deliverable:'宣讲会海报/折页',status:'正在进行'}),
    t({content:'特发集团业务调研',type:'调研类',project:'特发集团',start:'2026-07-06',due:'2026-07-09',actual:'2026-07-09',progress:100,deliverable:'业务调研表',status:'已交付'}),
    t({content:'特发集团推文撰写',type:'文案撰写类',project:'特发集团',start:'2026-07-10',due:'2026-07-14',progress:50,deliverable:'公众号推文',status:'正在进行'}),
    t({content:'特发集团数据整理',type:'执行协调类',project:'特发集团',start:'2026-07-20',due:'2026-07-24',progress:0,deliverable:'数据汇总表',status:'未完成'}),
    t({content:'特发集团宣传视频脚本',type:'文案宣传类',project:'特发集团',start:'2026-07-22',due:'2026-07-28',progress:10,deliverable:'视频脚本',difficulty:'创意卡壳→参考竞品',status:'未完成'})
  ];
  const logs = [
    l('2026-07-06 09:12','add','','新增任务《完成磷酸铁锂电池行业研究报告》（招商局）'),
    l('2026-07-08 14:30','add','','新增任务《整理招商局面试话术》（招商局）'),
    l('2026-07-09 18:05','done','','交付《磷酸铁锂电池行业研究报告》，提前1天'),
    l('2026-07-10 10:00','add','','新增任务《特发集团业务调研》'),
    l('2026-07-14 20:10','done','','交付《招商局面试话术》，延期2天'),
    l('2026-07-15 09:00','add','','新增任务《招商局终面PPT制作》'),
    l('2026-07-20 11:00','add','','新增任务《特发集团数据整理》')
  ];
  const notes = [
    {id:uid(),ts:'2026-07-12 21:40',text:'突然想到可以用 SWOT 框架重做招商局那页'},
    {id:uid(),ts:'2026-07-19 08:15',text:'宣讲会物料统一用蓝色主视觉，和招商局区分开'}
  ];
  const files = [
    {id:uid(),name:'磷酸铁锂行业研究报告PPT',project:'招商局',type:'调研类',uploaded:'2026-07-09',note:'终版',createdAt:nowISO()},
    {id:uid(),name:'招商局面试话术文档',project:'招商局',type:'文案撰写类',uploaded:'2026-07-14',note:'含复盘',createdAt:nowISO()},
    {id:uid(),name:'特发集团业务调研表',project:'特发集团',type:'调研类',uploaded:'2026-07-09',note:'',createdAt:nowISO()},
    {id:uid(),name:'特发集团推文 v1',project:'特发集团',type:'文案撰写类',uploaded:'2026-07-13',note:'待审',createdAt:nowISO()}
  ];
  return {tasks,logs,notes,reports:[],files,projectOrder:['招商局','特发集团'],
    filters:{type:'all',dueBefore:'',status:'all',cycle:'all'},
    fileFilters:{project:'all',type:'all',asc:true},
    roadmapSort:'asc', roadmapView:'board', ganttMode:'all', currentProject:'all'};
}
function l(ts,action,taskId,text){ return {id:uid(),ts,action,taskId,text}; }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function weekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=周日
  const diffToMon = (day===0? -6 : 1-day);
  const mon = new Date(now); mon.setDate(now.getDate()+diffToMon); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  const f = d=>{ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
  return {start:f(mon), end:f(sun)};
}
function inWeek(d){ if(!d) return false; const {start,end}=weekRange(); return d>=start && d<=end; }

/* ============ 工具 ============ */
function $(s,r=document){ return r.querySelector(s); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(d){ if(!d) return '—'; const a=d.split('-'); return a.length===3?`${+a[1]}/${+a[2]}`:d; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function diffDays(task){ return daysBetween(task.due, task.actual); } // 负=提前
function projects(){ return state.projectOrder.slice(); }
function projectExists(p){ return state.projectOrder.includes(p); }

function addLog(action,taskId,text){

}

      }
    });
  });
}

/* ============ 快速录入：自动识别 ============ */
function parseQuick(text){
  const t = text;
  let project='', type='', start='', due='', content=t;
  // 项目
  ['招商局','特发集团','高新投','高薪投'].forEach(p=>{ if(t.includes(p)) project=p; });
  // 任务类型（显式提及 调研类/文案撰写类…）
  TYPES.forEach(tp=>{ if(t.includes(tp)) type=tp; });
  if(!type){
    if(/调研/.test(t)) type='调研类';
    else if(/宣传|物料|海报|视频脚本|推文/.test(t)) type='文案宣传类';
    else if(/文案|撰写|话术/.test(t)) type='文案撰写类';
    else if(/设计|PPT/.test(t)) type='设计类';
    else if(/整理|协调|执行/.test(t)) type='执行协调类';
  }
  // 日期
  const dmatch = [...t.matchAll(/(\d{1,2})[月\/\.\-](\d{1,2})[日]?/g)];
  const dates = dmatch.map(m=>`${YEAR}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`);
  if(dates.length>=1) start = dates[0];
  if(dates.length>=2) due = dates[1];
  // 关键词修正：预计/交付 后的日期作 due；启动/起始 后的作 start
  const dueM = t.match(/(?:预计|交付)[^\d]*(\d{1,2})[月\/\.\-](\d{1,2})/);
  if(dueM) due = `${YEAR}-${String(+dueM[1]).padStart(2,'0')}-${String(+dueM[2]).padStart(2,'0')}`;
  // 内容：去掉已识别的日期、项目、类型词
  content = t.replace(/(\d{1,2})[月\/\.\-](\d{1,2})[日]?/g,'')
             .replace(/招商局|特发集团|高新投|高薪投/g,'')
             .replace(/调研类|文案撰写类|文案宣传类|设计类|执行协调类|其他/g,'')
             .replace(/预计|交付|启动|起始|开始/g,'').replace(/\s+/g,'').trim();
  if(!content) content = t.slice(0,30);
  return {project,type,start,due,content};
}

  const p = parseQuick(text);
  const projOpts = projects().map(pr=>`<option ${pr===p.project?'selected':''}>${esc(pr)}</option>`).join('');
  const typeOpts = TYPES.map(tp=>`<option ${tp===p.type?'selected':''}>${esc(tp)}</option>`).join('');
  const html = `<h3>识别结果 · 请确认</h3>

    if(!projectExists(project)){ state.projectOrder.push(project); }

  if(f.cycle!=='all') list = list.filter(t=>t.cycle===f.cycle);

  list.sort((a,b)=> (a.start||'').localeCompare(b.start||'') * (state.roadmapSort==='asc'?1:-1));
  return list;

/* ============ 甘特图 A+B ============ */
function ganttHTML(list){
  if(!list.length) return '<p class="muted">无匹配任务</p>';
  const dates = list.flatMap(t=>[t.start,t.due,t.actual].filter(Boolean)).sort();
  const min = dates[0], max = dates[dates.length-1];
  const span = Math.max(1, daysBetween(min,max));
  const bar = (s,e,warm)=>{ if(!s||!e) return ''; const off=daysBetween(min,s), len=daysBetween(s,e); const left=off/span*100, width=Math.max(3,len/span*100); return `<div class="gbar ${warm?'gwarm':'gcool'}" style="left:${left}%;width:${width}%"></div>`; };
  const tabs = `<div class="tabs">
    <button class="${state.ganttMode==='all'?'on':''}" data-gm="all">并排对照</button>
    <button class="${state.ganttMode==='plan'?'on':''}" data-gm="plan">只看计划</button>
    <button class="${state.ganttMode==='actual'?'on':''}" data-gm="actual">只看实际</button>
  </div>`;
  const taskRow = (t)=>{
    const d = diffDays(t);
    let badge = '';
    if(t.actual && t.due){ badge = d<0?`<span class="gbadge b-y">提前${-d}天</span>`: d>0?`<span class="gbadge b-b">延期${d}天</span>`:`<span class="gbadge b-g">准时</span>`; }
    return `<div class="gtask"><span>${esc(t.content)}</span><div class="gtrack">${bar(t.start,t.due,true)}${state.ganttMode!=='plan'?bar(t.start,t.actual,false):''}</div><span>${badge}</span></div>`;
  };
  const planBlock = (state.ganttMode==='actual')?'':`<div class="gtitle"><span class="gdot gwarm"></span>计划甘特 · 起始 → 预计交付</div>${list.map(t=>{const off=daysBetween(min,t.start),len=daysBetween(t.start,t.due);return `<div class="gtask"><span>${esc(t.content)}</span><div class="gtrack">${bar(t.start,t.due,true)}</div><span></span></div>`;}).join('')}`;
  const actualBlock = (state.ganttMode==='plan')?'':`<div class="gtitle" style="margin-top:12px"><span class="gdot gcool"></span>实际甘特 · 起始 → 实际交付</div>${list.map(t=>{const off=daysBetween(min,t.start),len=daysBetween(t.start,t.actual);return `<div class="gtask"><span>${esc(t.content)}</span><div class="gtrack">${bar(t.start,t.actual,false)}</div><span>${t.actual&&t.due?(diffDays(t)<0?'<span class="gbadge b-y">提前'+(-diffDays(t))+'天</span>':diffDays(t)>0?'<span class="gbadge b-b">延期'+diffDays(t)+'天</span>':'<span class="gbadge b-g">准时</span>'):''}</span></div>`;}).join('')}`;
  const scale = `<div class="gscale"><span>${fmt(min)}</span><span>${fmt(max)}</span></div>`;
  return tabs + planBlock + actualBlock + scale + `<p class="hint">🟡提前=任务较简单可简化；🔵延期=任务较难需更多时间。此为你的「难度参考库」。</p>`;
}

    <div class="field"><label>周期</label><input id="e_cycle" value="${esc(t.cycle)}"></div>

    <div class="field"><label>预计交付日期 *</label><input id="e_due" type="date" value="${esc(t.due)}"></div>
    <div class="field"><label>实际交付日期</label><input id="e_actual" type="date" value="${esc(t.actual)}"></div>
    <div class="field"><label>整体进度</label><input id="e_prog" type="number" min="0" max="100" value="${t.progress||0}"></div>
    <div class="field"><label>交付成果</label><input id="e_del" value="${esc(t.deliverable)}"></div>
    <div class="field"><label>关联任务</label><select id="e_rel"><option value="">—</option>${relOpts}</select></div>
    <div class="field"><label>难点和动作</label><input id="e_diff" value="${esc(t.difficulty)}"></div>
    <div class="field"><label>负责人</label><input id="e_owner" value="${esc(t.owner)}"></div>
    <div class="field"><label>父记录</label><input id="e_parent" value="${esc(t.parent)}"></div>
    <div class="field"><label>状态</label><select id="e_status">${STATUSES.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>
    <div style="text-align:right">
      <button class="btn ghost sm" id="eCancel">取消</button>
      <button class="btn warn sm" id="eDel">删除</button>
      <button class="btn ok sm" id="eSave">保存</button>
    </div>`;
  openModal(html);
  $('#eCancel').addEventListener('click',closeModal);
  $('#eDel').addEventListener('click',()=>{ if(confirm('确认删除该任务？')){ state.tasks=state.tasks.filter(x=>x.id!==id); addLog('delete',id,`删除任务《${t.content}》`); save(); closeModal(); render(); } });
  $('#eSave').addEventListener('click',()=>{
    Object.assign(t,{content:$('#e_content').value.trim(),type:$('#e_type').value,project:$('#e_project').value,cycle:$('#e_cycle').value,start:$('#e_start').value,due:$('#e_due').value,actual:$('#e_actual').value,progress:+$('#e_prog').value,deliverable:$('#e_del').value,related:$('#e_rel').value,difficulty:$('#e_diff').value,owner:$('#e_owner').value,parent:$('#e_parent').value,status:$('#e_status').value,updatedAt:nowISO()});
    if(!projectExists(t.project)) state.projectOrder.push(t.project);
    addLog('update', t.id, `修改任务《${t.content}》`);
    save(); closeModal(); render();
  });
}

  <div class="card">
    <div class="section-h">⚡ 上传文件（快录）</div>
    <div class="quick">
      <textarea id="upInput" placeholder="粘贴/输入文件信息，系统自动识别。例：招商局 7/20 上传 终面PPT v2（设计类）"></textarea>
      <button class="btn" id="upBtn">识别并填入</button>
    </div>
    <div class="hint">支持自动识别：项目（招商局/特发集团）、类型、上传日期（M/D 或 M月D日，缺省为今天）。</div>
  </div>
  <div class="card">
    <div class="filterbar" style="margin-bottom:12px">
      <span class="fl">项目：</span><select id="ff_proj"><option value="all">全部</option>${projects().map(p=>`<option ${state.fileFilters.project===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <span class="fl">文件类型：</span><select id="ff_type"><option value="all">全部</option>${TYPES.map(tp=>`<option ${state.fileFilters.type===tp?'selected':''}>${esc(tp)}</option>`).join('')}</select>
      <span class="fl">上传日期：</span><button class="sortbtn" id="ff_sort">${state.fileFilters.asc?'正序↑':'倒序↓'}</button>
    </div>
    <table class="board"><thead><tr><th>文件名</th><th>项目</th><th>文件类型</th><th>上传日期</th><th>备注</th></tr></thead><tbody id="fbody"></tbody></table>
  </div>`;
  setMain(html);
  const draw = ()=>{
    let items = state.files.slice();
    if(state.fileFilters.project!=='all') items = items.filter(i=>i.project===state.fileFilters.project);
    if(state.fileFilters.type!=='all') items = items.filter(i=>i.type===state.fileFilters.type);
    items.sort((a,b)=> (a.uploaded||'').localeCompare(b.uploaded||'') * (state.fileFilters.asc?1:-1));
    $('#fbody').innerHTML = items.map(i=>`<tr><td>${esc(i.name)}</td><td><span class="pill">${esc(i.project||'—')}</span></td><td><span class="pill">${esc(i.type)}</span></td><td>${fmt(i.uploaded)}</td><td>${esc(i.note||'—')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">暂无文件，用上方快录框上传</td></tr>';
  };
  draw();
  $('#upBtn').addEventListener('click',()=>{ const v=$('#upInput').value.trim(); if(!v){alert('请输入文件信息');return;} openFilePreview(v); });
  $('#ff_proj').addEventListener('change',e=>{ state.fileFilters.project=e.target.value; save(); draw(); });
  $('#ff_type').addEventListener('change',e=>{ state.fileFilters.type=e.target.value; save(); draw(); });
  $('#ff_sort').addEventListener('click',()=>{ state.fileFilters.asc=!state.fileFilters.asc; save(); draw(); $('#ff_sort').textContent = state.fileFilters.asc?'正序↑':'倒序↓'; });
}

/* ============ 上传文件：自动识别 ============ */
function parseFile(text){
  const t = text;
  let project='', type='其他', uploaded='', name=t;
  ['招商局','特发集团','高新投','高薪投'].forEach(p=>{ if(t.includes(p)) project=p; });
  TYPES.forEach(tp=>{ if(t.includes(tp)) type=tp; });
  const dmatch = [...t.matchAll(/(\d{1,2})[月\/\.\-](\d{1,2})[日]?/g)];
  const dates = dmatch.map(m=>`${YEAR}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`);
  uploaded = dates.length>=1 ? dates[0] : todayStr();
  name = t.replace(/(\d{1,2})[月\/\.\-](\d{1,2})[日]?/g,'')
          .replace(/招商局|特发集团|高新投|高薪投/g,'')
          .replace(/调研类|文案撰写类|文案宣传类|设计类|执行协调类|其他/g,'')
          .replace(/\s+/g,'').trim() || t.slice(0,30);
  return {project,type,uploaded,name};
}
function openFilePreview(text){
  const p = parseFile(text);
  const projOpts = projects().map(pr=>`<option ${pr===p.project?'selected':''}>${esc(pr)}</option>`).join('');
  const typeOpts = TYPES.map(tp=>`<option ${tp===p.type?'selected':''}>${esc(tp)}</option>`).join('');
  const html = `<h3>文件识别结果 · 请确认</h3>
    <div class="field"><label>文件名 <span class="req">*</span></label><input id="f_name" value="${esc(p.name)}"></div>
    <div class="field"><label>项目</label><select id="f_proj"><option value="">—</option>${projOpts}</select></div>
    <div class="field"><label>文件类型</label><select id="f_type">${typeOpts}</select></div>
    <div class="field"><label>上传日期 <span class="req">*</span></label><input id="f_up" type="date" value="${esc(p.uploaded)}"></div>
    <div class="field"><label>备注</label><input id="f_note" placeholder="可选"></div>
    <div style="text-align:right;margin-top:10px">
      <button class="btn ghost sm" id="mCancel">取消</button>
      <button class="btn ok sm" id="mSave">确认上传</button>
    </div>`;
  openModal(html);
  $('#mCancel').addEventListener('click', closeModal);
  $('#mSave').addEventListener('click', ()=>{
    const name=$('#f_name').value.trim();
    const project=$('#f_proj').value;
    const type=$('#f_type').value;
    const uploaded=$('#f_up').value;
    if(!name||!uploaded){ alert('必填：文件名、上传日期'); return; }
    state.files.push({id:uid(),name,project,type,uploaded,note:$('#f_note').value,createdAt:nowISO()});
    if(project && !projectExists(project)) state.projectOrder.push(project);
    addLog('file', null, `上传文件《${name}》${project?('（'+project+'）'):''}`);
    save(); closeModal();
    alert('已上传文件，工作日志已记录。');
    renderFiles();
  });
}

/* ============ 工作日志 ============ */
function renderLogs(){
  let html = `${pageHeader('05','工作日志','LOGS','按天记录 · 日报/周报素材')}
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="date" id="ldate" style="border:1px solid var(--line);border-radius:8px;padding:6px">
      <input id="lkw" placeholder="关键词搜索" style="border:1px solid var(--line);border-radius:8px;padding:6px">
      <button class="btn ghost sm" id="lreset">显示全部</button>
    </div>
    <div class="card" id="logbody"></div>`;
  setMain(html);
  const draw = (date,kw)=>{
    let logs = state.logs.slice();
    if(date) logs = logs.filter(x=>x.ts.startsWith(date));
    if(kw) logs = logs.filter(x=>x.text.includes(kw));
    const groups = {};
    logs.forEach(x=>{ const day=x.ts.slice(0,10); (groups[day]=groups[day]||[]).push(x); });
    const keys = Object.keys(groups).sort().reverse();
    $('#logbody').innerHTML = keys.length? keys.map(d=>`<div class="day-group"><div class="dh">${d}</div><ul class="tl">${groups[d].map(x=>`<li><span class="muted">${esc(x.ts.slice(11))}</span> · ${esc(x.text)}</li>`).join('')}</ul></div>`).join('') : '<p class="muted">无记录</p>';
  };
  draw('','');
  $('#ldate').addEventListener('change',e=>draw(e.target.value,$('#lkw').value.trim()));
  $('#lkw').addEventListener('input',e=>draw($('#ldate').value,e.target.value.trim()));
  $('#lreset').addEventListener('click',()=>{ $('#ldate').value=''; $('#lkw').value=''; draw('',''); });
}

/* ============ 报告生成（日报/周报/代办） ============ */
function buildReport(type){
  const tasks = state.tasks;
  const done = tasks.filter(t=>t.status==='已交付');
  const doing = tasks.filter(t=>t.status==='正在进行');
  const todo = tasks.filter(t=>t.status==='未完成');
  const bullets = arr => arr.length? arr.map(t=>`• ${t.content}（${t.project}）`).join('\n') : '• （无）';
  if(type==='daily') return {
    done: bullets(done), doing: bullets(doing), todo: bullets(todo)
  };
  if(type==='weekly') return {
    done: bullets(done), doing: bullets(doing), todo: bullets(todo)
  };
  // todo：未完成任务的预期交付
  const lines = todo.length? todo.map(t=>`• ${fmt(t.due)} 前交付：${t.content}（${t.project}）`).join('\n') : '• （无待交付）';
  return { done:'', doing:'', todo: lines };
}
function openReport(type){
  const c = buildReport(type);
  const titleMap = {daily:'生成日报',weekly:'生成周报',todo:'生成代办'};
  const html = `<h3>${titleMap[type]}（可编辑，确认后展示在概况）</h3>
    <div class="field"><label>已完成</label><textarea class="edit" id="r_done" rows="4">${esc(c.done)}</textarea></div>
    <div class="field"><label>正在进行</label><textarea class="edit" id="r_doing" rows="4">${esc(c.doing)}</textarea></div>
    <div class="field"><label>待发展</label><textarea class="edit" id="r_todo" rows="4">${esc(c.todo)}</textarea></div>
    <div style="text-align:right"><button class="btn ghost sm" id="rc">取消</button><button class="btn ok sm" id="rk">确认生成</button></div>`;
  openModal(html);
  $('#rc').addEventListener('click',closeModal);
  $('#rk').addEventListener('click',()=>{
    const content = {done:$('#r_done').value, doing:$('#r_doing').value, todo:$('#r_todo').value};
    const key = type==='todo'? 'todo' : (type==='weekly'?'weekly': new Date().toISOString().slice(0,10));
    const exist = state.reports.find(r=>r.type===type);
    if(exist){ Object.assign(exist,{content,status:'confirmed',confirmedAt:nowISO()}); }
    else state.reports.push({id:uid(),type,content,status:'confirmed',confirmedAt:nowISO()});
    addLog('report', '', `生成并确认《${titleMap[type]}》`);
    save(); closeModal(); go('overview');
  });
}
