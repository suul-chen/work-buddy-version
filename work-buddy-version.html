    const b = baseNameOf(name);
    const v = nextVersionFor(b);
    const task={id:uid(),name:name,requirement,type,project,start,due,actual:'',progress:0,deliverable:'',related:relId,version:v,feedback:$m('#f_fb').value,difficulty:$m('#f_diff').value,owner:$m('#f_owner').value,status:'未开始',createdAt:nowISO(),updatedAt:nowISO()};
    state.tasks.push(task);
    addLog('add', 'task', task.id, `《${name}》`, project, snapshotFields(task, ADD_SNAPSHOT_FIELDS), `新增任务《${name}》${relId?'(子任务)':'(主任务)'}`);
    save(); closeModal(); render();
  });
}

/* ============ 批量录入：随手记拆解 ============ */
/* 两遍扫描，维护"上下文栈"：当前项目 / 当前起始 / 当前截止。
   识别模式：时间上下文行、项目分组标记、编号条目、无编号短句、局部时间片段（周X-周X / 周X前）。 */
function parseBatch(text, refDate){
  refDate = refDate || todayStr();
  const lines = (text||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  const tasks = [];
  /* 默认起止都=今天（适配每日计划场景）；若文本含显式日期则覆盖 */
  const ctx = { project:'', start: refDate, due: refDate };
  const discovered = [];
  const _stripDateG = new RegExp(MD_SRC, 'g');
  const _stripDateP = new RegExp('[（(]\\s*'+MD_SRC+'\\s*[）)]', 'g');
  const stripMeta = s => s.replace(_stripDateP,'')
    .replace(_stripDateG,'').replace(/周[一二三四五六日]/g,'')
    .replace(/[（）()]/g,'').replace(/[\s，,、。.．:：]/g,'');
  /* 判断一行是否为纯项目名（无冒号独立短句）：匹配已知项目/别名，或 stripMeta 后只剩候选项目名 */
  function isProjectLine(raw, left){
    // 带冒号：招商局：
    const c = raw.match(/^([^：:]+)[：:]\s*$/);
    if(c) return normalizeProject(c[1]) || null;
    // 无冒号但整行就是某个已知/已发现的项目名
    const pool = new Set([...(state?state.projectOrder:[]), ...Object.keys(PROJECT_ALIASES), ...Object.values(PROJECT_ALIASES), ...discovered]);
    for(const p of pool){ if(p && left===p) return normalizeProject(p); }
    // 行首是已知项目名且后面无实质内容（仅标点/空格）
    for(const p of pool){
      if(p && (raw.startsWith(p+' ')||raw.startsWith(p+'，')||raw.startsWith(p+',')||raw===p)){
        const rest = raw.slice(p.length).trim();
        if(!rest || /^[\s，,、。.．:：]+$/.test(rest)) return normalizeProject(p);
      }
    }
    return null;
  }
  /* 判断是否为子行（要求/备注/注意/缩进 → 追加上一条任务） */
  function isSubLine(raw){
    const trimmed = raw.trimStart();  // 保留原始缩进信息
    if(/^\s+/.test(raw) && /^(要求|备注|注意|说明|包含|内容)[：:]/.test(trimmed)) return trimmed.replace(/^(要求|备注|注意|说明|包含|内容)[：:]\s*/,'');
    if(/^\s+/.test(raw)) return trimmed;  // 任意缩进行都当子行追加
    if(/^(要求|备注|注意|说明|包含|内容)[：:]/.test(trimmed)) return trimmed.replace(/^(要求|备注|注意|说明|包含|内容)[：:]\s*/,'');
    return null;
  }

  for(const raw of lines){
    const left = stripMeta(raw);
    // ① 时间上下文行 → 仅更新默认上下文，不生成任务
    if(left==='' || left==='前的任务' || left==='任务' || left==='前'){
      const dates = extractDates(raw);
      if(dates.length>=1) ctx.start = dates[0];
      if(dates.length>=2) ctx.due = dates[1];
      const pm = raw.match(new RegExp('[（(]\\s*'+MD_SRC+'\\s*[）)]'));
      if(pm){ const ds=extractDates(pm[0]); if(ds.length) ctx.due = ds[0]; }
      continue;
    }
    // ② 项目分组标记（带冒号 或 无冒号独立项目名）→ 更新当前项目上下文
    const proj = isProjectLine(raw, left);
    if(proj){
      ctx.project = proj; if(!discovered.includes(proj)) discovered.push(proj); continue;
    }
    // ③ 子行（要求/备注/缩进）→ 追加到上一条任务的任务要求
    const subContent = isSubLine(raw);
    if(subContent !== null && tasks.length){
      const last = tasks[tasks.length-1];
      if(last.requirement) last.requirement += '；'+subContent;
      else last.requirement = subContent;
      continue;
    }
    // ④ 任务行：继承上下文，再应用本行覆盖
    let project = ctx.project;
    let projUncertain = false;
    const inline = findInlineProject(raw, discovered);
    if(inline){ project = inline; if(!discovered.includes(inline)) discovered.push(inline); }
    else if(!project){ project = '待定'; projUncertain = true; }
    let start = ctx.start, due = ctx.due;
    // 局部时间片段
    const wr = raw.match(/周([一二三四五六日])\s*[-~～]\s*周([一二三四五六日])/);
    if(wr){ start = resolveWeekday(wr[1], refDate); due = resolveWeekday(wr[2], refDate); }
    else { const wd = raw.match(/周([一二三四五六日])\s*[前之]/); if(wd) due = resolveWeekday(wd[1], refDate); }
    // 内容清洗（预编译正则避免内联 new RegExp 在部分环境下解析异常）
    const _reDateG = new RegExp(MD_SRC, 'g');
    const _reDatePG = new RegExp('[（(]\\s*'+MD_SRC+'\\s*[）)]', 'g');
    let name = raw.replace(/^[1-9][0-9]?[、.．]\s*/, '');
    if(inline) name = name.replace(inline, '');
    name = name.replace(/周[一二三四五六日]\s*[-~～]\s*周[一二三四五六日]/g,'')
      .replace(/周[一二三四五六日]\s*[前之]/g,'').replace(/周[一二三四五六日]/g,'')
      .replace(_reDatePG,'').replace(_reDateG,'')
      .replace(/[，,、。.．:：\s]+/g,' ').trim();
    if(!name) name = raw.slice(0,30);
    const type = detectType(name && name.length ? name : raw);
    tasks.push({ project, type, name, requirement:'', start, due, status:'未开始', projUncertain, dueUncertain: !due });
  }
  return tasks;
}

/* 批量录入弹窗 */
function openBatchModal(){
  const html = `<h3>批量录入 · 随手记拆解</h3>
    <div class="hint">粘贴一段随手记（可混合多项目 / 时间 / 编号），点「解析预览」自动拆条。识别不确定的单元格会<b style="color:#b8860b">标黄</b>，可逐条改归属、编辑、删除。</div>
    <textarea id="batchInput" class="edit" rows="9" placeholder="例：&#10;7.27，周三（7.29）前的任务&#10;招商局：&#10; 1、伴手礼推荐，40-50元/份，200份*10场（总价约9w）&#10; 2、跟进中大、华科、央财场地动线信息，用ppt呈现，邮件待回复&#10;特发：&#10; 同行调研ppt收尾，参照去年的策划书&#10;周三-周五 兴邦金租 贴截图&#10;高新投 目标院校调研"></textarea>
    <div style="margin-top:10px;display:flex;gap:10px">
      <button class="btn" id="batchParse">解析预览</button>
      <button class="btn ghost sm" id="batchClear">清空</button>
    </div>
    <div id="batchPreview"></div>
    <div style="text-align:right;margin-top:14px;display:none" id="batchFoot">
      <button class="btn ghost sm" id="batchCancel">取消</button>
      <button class="btn ok sm" id="batchSave">确认批量保存</button>
    </div>`;
  openModal(html, true);
  $('#batchParse').addEventListener('click',()=>{
    const txt=$('#batchInput').value;
    if(!txt.trim()){ alert('请先粘贴随手记'); return; }
    renderBatchPreview(txt);
  });
  $('#batchClear').addEventListener('click',()=>{ $('#batchInput').value=''; $('#batchPreview').innerHTML=''; $('#batchFoot').style.display='none'; });
  $('#batchCancel').addEventListener('click',closeModal);
  $('#batchSave').addEventListener('click',confirmBatch);
}

function renderBatchPreview(text){
  const parsed = parseBatch(text, todayStr());
  if(!parsed.length){ $('#batchPreview').innerHTML='<p class="hint" style="margin-top:12px">未能识别到任务，请检查格式（建议按"项目： / 编号 / 短句"分行）。</p>'; $('#batchFoot').style.display='none'; return; }
  const allProjects = [...new Set([...state.projectOrder, ...parsed.map(x=>x.project).filter(Boolean)])];
  const projOpts = p => allProjects.map(pr=>`<option ${pr===p?'selected':''}>${esc(pr)}</option>`).join('') + (p==='待定'?`<option selected>待定</option>`:`<option>待定</option>`);
  const typeOpts = t => getTypes().map(tp=>`<option ${tp===t?'selected':''}>${esc(tp)}</option>`).join('');
  const statusOpts = s => STATUSES.map(st=>`<option ${st===s?'selected':''}>${esc(st)}</option>`).join('');
  const card = (x,i)=>`
    <div class="batch-card" data-i="${i}">
      <div class="bc-line bc-meta">
        <span class="bc-idx">${i+1}</span>
        <span class="bc-field${x.projUncertain?' warn':''}"><label>项目</label><select class="bproj">${projOpts(x.project)}</select></span>
        <span class="bc-field"><label>类型</label><div style="display:flex;gap:4px"><select class="btype" style="flex:1">${typeOpts(x.type)}</select><button class="btn sm ghost bedit-type" type="button" style="font-size:9px;padding:3px 6px">编辑类型</button></div></span>
        <span class="bc-field"><label>状态</label><select class="bstatus">${statusOpts(x.status)}</select></span>
        <span class="bc-field${!x.start?' warn':''}"><label>起始</label><div style="display:flex;gap:6px"><input type="date" class="bstart" value="${esc(x.start)}" style="flex:1"><button class="btn sm ghost today-btn" style="font-size:9px;padding:3px 6px" data-target="bstart" data-fill="today">当日</button></div></span>
        <span class="bc-field${x.dueUncertain?' warn':''}"><label>预计交付</label><div style="display:flex;gap:6px"><input type="date" class="bdue" value="${esc(x.due)}" style="flex:1"><button class="btn sm ghost today-btn" style="font-size:9px;padding:3px 6px" data-target="bstart" data-fill="ref">当日</button></div></span>
        <button class="btn sm ghost bdel">删除</button>
      </div>
      <div class="bc-line bc-content">
        <span class="bc-field bc-name"><label>任务名称 *</label><input class="bname" value="${esc(x.name)}"></span>
        <span class="bc-field bc-req"><label>任务要求</label><input class="breq" value="${esc(x.requirement)}" placeholder="要求/备注"></span>
        <span class="bc-field bc-rel"><label>母任务（同项目·可二级）</label>
          <span class="rel-cascade">
            <select class="brel1">${relL1OptionsHTML(x.project,'')}</select><select class="brel2" style="display:none"></select>
          </span>
        </span>
      </div>
    </div>`;
  const cards = parsed.map((x,i)=>card(x,i)).join('');
  $('#batchPreview').innerHTML = `
    <div class="batch-summary">共识别 <b id="batchCnt">${parsed.length}</b> 条任务（标黄 = 识别不确定，可改；每条独立小窗编辑，先选项目再选「母任务」，可选二级层级）</div>
    <div id="batchTbody" class="batch-cards">${cards}</div>`;
  $('#batchFoot').style.display='block';
  const refreshBrel2 = card =>{
    const l1=card.querySelector('.brel1').value, l2=card.querySelector('.brel2');
    const opts=relL2OptionsHTML(l1,'');
    if(opts){ l2.innerHTML=opts; l2.style.display='inline-block'; } else { l2.style.display='none'; }
  };
  const refreshBrel1 = card =>{ card.querySelector('.brel1').innerHTML=relL1OptionsHTML(card.querySelector('.bproj').value,''); refreshBrel2(card); };
  const childClass = card =>{ card.classList.toggle('batch-child', !!(card.querySelector('.brel1').value || card.querySelector('.brel2').value)); };
  $('#batchTbody').querySelectorAll('.batch-card').forEach(card=>{
    card.querySelector('.bdel').addEventListener('click',e=>{
      e.target.closest('.batch-card').remove();
      const cnt=$('#batchTbody').children.length;
      const c=$('#batchCnt'); if(c) c.textContent=cnt;
      if(cnt===0){ $('#batchFoot').style.display='none'; $('#batchPreview').innerHTML='<p class="hint" style="margin-top:12px">已全部删除。</p>'; }
    });
    card.querySelector('.bproj').addEventListener('change',()=>{ refreshBrel1(card); childClass(card); });
    card.querySelector('.brel1').addEventListener('change',()=>{ refreshBrel2(card); childClass(card); });
    card.querySelector('.brel2').addEventListener('change',()=>{ childClass(card); });
    card.querySelector('.bedit-type').addEventListener('click',openTypeEditor);
  });
}

function confirmBatch(){
  const rows = $('#batchTbody') ? [...$('#batchTbody').children] : [];
  if(!rows.length){ alert('没有可保存的任务'); return; }
  let n=0, skipped=0;
  rows.forEach(tr=>{
    const name=tr.querySelector('.bname').value.trim();
    const requirement=tr.querySelector('.breq').value.trim();
    const type=tr.querySelector('.btype').value;
    const start=tr.querySelector('.bstart').value;
    const due=tr.querySelector('.bdue').value;
    const status=tr.querySelector('.bstatus').value;
    const relId=tr.querySelector('.brel2').value || tr.querySelector('.brel1').value;
    if(!name){ skipped++; return; }
    const par=relId?state.tasks.find(x=>x.id===relId):null;
    let project=tr.querySelector('.bproj').value;
    if(par && par.project) project=par.project;   // 子任务跟随母任务项目
    if(project && project!=='待定'){ if(!projectExists(project)) state.projectOrder.push(project); }
    else if(project==='待定'){ if(!projectExists('待定')) state.projectOrder.push('待定'); }
    const b=baseNameOf(name);
    const v=nextVersionFor(b);
    const task={id:uid(),name:name,requirement,type,project,start,due,actual:'',progress:0,deliverable:'',related:relId||'',version:v,feedback:'',difficulty:'',owner:OWNER_DEFAULT,status:status||'未开始',createdAt:nowISO(),updatedAt:nowISO()};
    state.tasks.push(task);
    addLog('add', 'task', task.id, `《${name}》`, project, snapshotFields(task, ADD_SNAPSHOT_FIELDS), `批量录入·新增任务《${name}》${relId?'(子任务)':''}${project?('（'+project+'）'):''}`);
    n++;
  });
  addLog('batch', 'report', '', '', '', [], `批量录入 ${n} 条任务`);
  save(); closeModal();
  alert(`已批量保存 ${n} 条任务${skipped?`（跳过 ${skipped} 条空内容）`:''}，工作日志已记录。`);
  go(route);
}

/* ============ Roadmap ============ */
function filteredTasks(){
  let list = state.tasks.slice();
  if(state.currentProject!=='all') list = list.filter(t=>t.project===state.currentProject);
  const f = state.filters;
  if(f.type!=='all') list = list.filter(t=>t.type===f.type);
  if(f.status!=='all') list = list.filter(t=>t.status===f.status);
  if(f.startFrom) list = list.filter(t=>t.start && t.start>=f.startFrom);
  if(f.dueBefore) list = list.filter(t=>t.due && t.due<=f.dueBefore);
  list.sort((a,b)=> (a.start||'').localeCompare(b.start||'') * (state.roadmapSort==='asc'?1:-1));
  return list;
}

/* ============ 母/子任务（树形）辅助 ============ */
function childTasksOf(id){ return state.tasks.filter(t=>t.related===id); }
function isParentTask(t){ return state.tasks.some(c=>c.related===t.id); }
function parentOf(t){ return t.related ? state.tasks.find(x=>x.id===t.related) : null; }
function wouldCreateCycle(childId, parentId){
  if(!parentId || parentId===childId) return false;
  let cur=parentId; const seen=new Set();
  while(cur){ if(cur===childId) return true; if(seen.has(cur)) return true; seen.add(cur);
    const p=state.tasks.find(x=>x.id===cur); cur = p? p.related : ''; }
  return false;
}
/* 可作为母任务的候选：排除自身及其后代（防环），避免把子任务设为自己的祖先；
   proj 非空时仅限同项目（母/子任务按项目作用域隔离） */
function parentCandidates(excludeId, proj){
  const banned=new Set([excludeId]);
  let changed=true;
  while(changed){ changed=false; state.tasks.forEach(t=>{ if(banned.has(t.related) && !banned.has(t.id)){ banned.add(t.id); changed=true; } }); }
  return state.tasks.filter(t=>!banned.has(t.id) && t.id!==excludeId && (!proj || t.project===proj));
}
/* 某任务的顶级祖先（related='' 的那一层）id —— 用于级联定位母任务所处层 */
function topAncestorId(id){
  let cur=id; const seen=new Set();
  while(true){ if(seen.has(cur)) return cur; seen.add(cur);
    const t=state.tasks.find(x=>x.id===cur);
    if(!t || !t.related) return cur; cur=t.related; }
}
/* 项目内顶级任务（related=''），即级联第一级母任务候选 */
function projectParents(proj){ return state.tasks.filter(t=>(t.project===proj) && t.related===''); }
/* 级联下拉选项：一级母任务（项目内顶级任务） / 二级母任务（某母任务的子任务） */
function relL1OptionsHTML(proj, sel){
  if(!proj) return '<option value="">— 请先选择项目</option>';
  const opts = projectParents(proj).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
  return '<option value="">—（新建为顶级任务）</option>'+opts;
}

/* ============ 甘特图拖拽平移 ============ */
let _ganttDragCleanup = null;
function initGanttDrag(){
  const timeline = document.getElementById('ganttTimeline');
  const inner = document.getElementById('ganttInner');
  if(!timeline || !inner) return;
  if(_ganttDragCleanup) { _ganttDragCleanup(); _ganttDragCleanup = null; }
  // 避免重复绑定：每次 renderRoadmap 都会调用，但 DOM 重建后引用已是新节点
  // 我们直接绑定到新 DOM 节点上，旧 DOM 销毁后旧监听器自动失效

  let dragging = false, startX = 0, startTranslate = 0, moved = 0;
  const getDayWidth = () => {
    const head = inner.querySelector('.gantt-head');
    if(!head) return 30;
    return head.offsetWidth / head.children.length;
  };

  const onDown = (e) => {
    if(e.target.closest('button') || e.target.closest('.gantt-bar')) return;
    dragging = true; moved = 0;
    timeline.classList.add('dragging');
    inner.classList.add('dragging');
    const style = getComputedStyle(inner);
    const matrix = new DOMMatrixReadOnly(style.transform);
    startTranslate = matrix.m41;
    startX = e.clientX;
    e.preventDefault();
  };

  const onMove = (e) => {
    if(!dragging) return;
    const dx = e.clientX - startX;
    moved = dx;
    inner.style.transform = `translateX(${startTranslate + dx}px)`;
  };

  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    timeline.classList.remove('dragging');
    inner.classList.remove('dragging');

    if(Math.abs(moved) < 15) { inner.style.transform = 'translateX(0)'; return; }

    const dayW = getDayWidth();
    const daysShifted = Math.round(-moved / dayW);
    if(daysShifted === 0) { inner.style.transform = 'translateX(0)'; return; }

    const d = new Date(state.ganttAnchor || todayStr());
    d.setDate(d.getDate() + daysShifted);
    const p=n=>String(n).padStart(2,'0');
    state.ganttAnchor = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    save(); renderRoadmap();
  };

  timeline.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  const cleanupDoc = () => {
    timeline.removeEventListener('mousedown', onDown);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  _ganttDragCleanup = cleanupDoc;

  // Wheel month-jump disabled: keep normal page scrolling.

  // 触摸事件（移动端）
  let touchStartX = 0, touchStartTrans = 0, touchMoved = 0, touchActive = false;
  const onTouchStart = (e) => {
    if(e.target.closest('button') || e.target.closest('.gantt-bar')) return;
    if(e.touches.length !== 1) return;
    touchActive = true; touchMoved = 0;
    timeline.classList.add('dragging');
    inner.classList.add('dragging');
    const style = getComputedStyle(inner);
    const matrix = new DOMMatrixReadOnly(style.transform);
    touchStartTrans = matrix.m41;
    touchStartX = e.touches[0].clientX;
  };
  const onTouchMove = (e) => {
    if(!touchActive) return;
    const dx = e.touches[0].clientX - touchStartX;
    touchMoved = dx;
    inner.style.transform = `translateX(${touchStartTrans + dx}px)`;
    e.preventDefault();
  };
  const onTouchEnd = () => {
    if(!touchActive) return;
    touchActive = false;
    timeline.classList.remove('dragging');
    inner.classList.remove('dragging');
    if(Math.abs(touchMoved) < 15) { inner.style.transform = 'translateX(0)'; return; }
    const dayW = getDayWidth();
    const daysShifted = Math.round(-touchMoved / dayW);
    if(daysShifted === 0) { inner.style.transform = 'translateX(0)'; return; }
    const d = new Date(state.ganttAnchor || todayStr());
    d.setDate(d.getDate() + daysShifted);
    const p=n=>String(n).padStart(2,'0');
    state.ganttAnchor = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    save(); renderRoadmap();
  };
  timeline.addEventListener('touchstart', onTouchStart, {passive: false});
  timeline.addEventListener('touchmove', onTouchMove, {passive: false});
  timeline.addEventListener('touchend', onTouchEnd);
}

function ganttHTML(list){
  if(!list.length) return '<p class="muted">无匹配任务</p>';
  const aDate = new Date(state.ganttAnchor || todayStr());
  const p=n=>String(n).padStart(2,'0');
  const dateStr = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;

  // 视图范围（仅月视图）
  let rangeStart, rangeEnd, days=[];
  rangeStart = new Date(aDate.getFullYear(), aDate.getMonth(), 1);
  rangeEnd = new Date(aDate.getFullYear(), aDate.getMonth()+1, 0);
  for(let d=new Date(rangeStart); d<=rangeEnd; d.setDate(d.getDate()+1)) days.push(new Date(d));
  const totalDays = days.length;
  const todayS = todayStr();
  const todayIdx = days.findIndex(d=> dateStr(d)===todayS);

  const titleText = `${rangeStart.getFullYear()}年${rangeStart.getMonth()+1}月`;

  const toolbar = `
    <div class="gantt-toolbar">
      <div class="gantt-title">${esc(titleText)}</div>
    </div>`;

  const headCells = days.map((d,i)=>{
    const dow = d.getDay();
    const wknd = (dow===0||dow===6)?'weekend':'';
    const isToday = i===todayIdx?'today':'';
    return `<div class="cell ${wknd} ${isToday}">${d.getDate()}</div>`;
  }).join('');

  const spanInfo = (start, actual) => {
    if(!start || !actual) return null;
    const sD = new Date(start), eD = new Date(actual);
    const fromD = sD <= eD ? sD : eD;
    const toD = sD <= eD ? eD : sD;
    if(toD < rangeStart || fromD > rangeEnd) return null;
    const fromS = dateStr(fromD), toS = dateStr(toD);
    let sIdx = days.findIndex(day=>dateStr(day)>=fromS);
    let eIdx = days.findIndex(day=>dateStr(day)>=toS);
    if(sIdx<0) sIdx=0;
    if(eIdx<0) eIdx=totalDays-1;
    const diff = daysBetween(start, actual);
    const duration = Math.max(1, Math.abs(diff==null?0:diff)+1);
    return {
      left: sIdx/totalDays*100,
      width: Math.max(3.2, (eIdx-sIdx+1)/totalDays*100),
      duration
    };
  };

  const barHTML = (t, indent)=>{
    const span = spanInfo(t.start, t.actual);
    if(!span) return '';
    return `<div class="gantt-row ${indent?'child':''}">
      <div class="gantt-bar gantt-actual" style="left:${span.left}%;width:${span.width}%" title="${esc(t.name)} · ${fmt(t.start)} → ${fmt(t.actual)} · ${span.duration}天" data-full-label="1">
        <span class="g-days">${span.duration}天</span><span class="g-name">【${esc(t.name)}】</span>
      </div>
    </div>`;
  };
  const summaryHTML = (parent, kids)=>{
    const spans = kids.filter(c=>c.start && c.actual);
    if(!spans.length) return '';
    const sMin = spans.map(c=>c.start).sort()[0];
    const dMax = spans.map(c=>c.actual).sort().slice(-1)[0];
    const span = spanInfo(sMin, dMax);
    if(!span) return '';
    const expanded=state.expandedParents.includes(parent.id);
    return `<div class="gantt-row parent">
      <div class="gantt-bar summary gantt-actual" style="left:${span.left}%;width:${span.width}%" data-toggle="${parent.id}" title="${esc(parent.name)} · ${fmt(sMin)} → ${fmt(dMax)} · ${span.duration}天" data-full-label="1">
        <span class="tw-toggle">${expanded?'▾':'▸'}</span>
        <span class="g-days">${span.duration}天</span><span class="g-name">【${esc(parent.name)}】</span>
      </div>
    </div>`;
  };
  const base = list;
  const baseIds = new Set(base.map(t=>t.id));
  const byParent = {};
  base.forEach(t=>{ const k=(t.related && baseIds.has(t.related))?t.related:''; (byParent[k]=byParent[k]||[]).push(t); });
  let rowsHTML='';
  const renderNode=(t)=>{
    const kids=(byParent[t.id]||[]);
    if(kids.length){
      rowsHTML+=summaryHTML(t,kids);
      if(state.expandedParents.includes(t.id)) kids.forEach(c=>{ const b=barHTML(c,true); if(b) rowsHTML+=b; });
    } else {
      const b=barHTML(t,false); if(b) rowsHTML+=b;
    }
  };
  (byParent['']||[]).forEach(renderNode);
  const rows = rowsHTML || '<div class="gantt-empty">当前视图范围内暂无已填写起始日期和实际交付日期的任务</div>';

  const todayLine = todayIdx>=0 ? `<div class="gantt-today-line" style="left:${(todayIdx+0.5)/totalDays*100}%"></div><div class="gantt-today-label" style="left:${(todayIdx+0.5)/totalDays*100}%">今天</div>` : '';

  const timeline = `
    <div class="gantt-timeline" id="ganttTimeline">
      <div class="gantt-inner" id="ganttInner">
        <div class="gantt-head" style="grid-template-columns:repeat(${totalDays},1fr)">${headCells}</div>
        <div class="gantt-rows">
          ${rows}
          ${todayLine}
        </div>
      </div>
    </div>`;

  const addBtn = `<button class="gantt-add" id="gAdd">+ 添加任务</button>`;

  return toolbar + timeline + addBtn + `<p class="hint">红条连接起始日期与实际交付日期；条内优先显示天数和任务名称，放不下时只显示天数。</p>`;
}

  const typeOpts = getTypes().map(tp=>`<option ${tp===t.type?'selected':''}>${esc(tp)}</option>`).join('');
  const relOpts = parentCandidates(id, t.project).map(x=>`<option value="${x.id}" ${x.id===t.related?'selected':''}>${esc(x.name)}</option>`).join('');
  const html = `<h3>编辑任务</h3>
    <div class="field"><label>任务名称 *</label><input id="e_name" value="${esc(t.name)}"></div>
    <div class="field"><label>任务要求</label><input id="e_req" value="${esc(t.requirement)}" placeholder="具体要求、备注等"></div>

/* ============ 删除任务（含母任务子任务勾选） ============ */
function deleteTaskWithChildren(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const kids=childTasksOf(id);
  if(!kids.length){
    if(confirm('确认删除任务《'+t.name+'》？')){ state.tasks=state.tasks.filter(x=>x.id!==id); addLog('delete','task',id,`《${t.name}》`,t.project,[],`删除任务《${t.name}》`); save(); closeModal(); render(); }
    return;
  }
  const items=kids.map(c=>`<label class="chk"><input type="checkbox" class="delkid" value="${c.id}"> ${esc(c.name)} <span class="muted">（${esc(c.project)} · ${esc(c.status)}）</span></label>`).join('');
  const html=`<h3>删除母任务《${esc(t.name)}》</h3>
    <div class="hint">该母任务下有 <b>${kids.length}</b> 个子任务。勾选 = 一并删除；<b>不勾选 = 提升为独立任务</b>（保留数据，不丢失）。</div>
    <div class="chk-list">${items}</div>
    <div style="text-align:right;margin-top:14px">
      <button class="btn ghost sm" id="dtCancel">取消</button>
      <button class="btn warn sm" id="dtKeep">仅删除母任务（子任务全提升）</button>
      <button class="btn warn sm" id="dtDel">删除母任务 + 勾选子任务</button>
    </div>`;
  openModal(html);
  $('#dtCancel').addEventListener('click',closeModal);
  $('#dtKeep').addEventListener('click',()=>{ promoteKids(kids.map(c=>c.id)); state.tasks=state.tasks.filter(x=>x.id!==id); addLog('delete','task',id,`《${t.name}》`,t.project,[],`删除母任务《${t.name}》（${kids.length} 子任务提升为独立）`); save(); closeModal(); render(); });
  $('#dtDel').addEventListener('click',()=>{
    const delIds=[...document.querySelectorAll('.delkid:checked')].map(c=>c.value);
    const keepIds=kids.map(c=>c.id).filter(x=>!delIds.includes(x));
    promoteKids(keepIds);
    state.tasks=state.tasks.filter(x=>x.id!==id && !delIds.includes(x.id));
    addLog('delete','task',id,`《${t.name}》`,t.project,[],`删除母任务《${t.name}》${delIds.length?` + ${delIds.length} 子任务`:''}`);
    save(); closeModal(); render();
  });
}

/* ============ 上传文件：自动识别 ============ */
function parseFile(text){
  const t = text;
  let project='', type='其他', uploaded='', name=t, url='';
  // URL 识别：feishu.cn / bytedance.feishu.cn / larkoffice.com 等
  const urlMatch = t.match(/(https?:\/\/[^\s]*?(?:feishu\.cn|larkoffice\.com|larksuite\.com)[^\s]*)/i);
  if(urlMatch){ url=urlMatch[1]; name=name.replace(urlMatch[1],''); }
  let rawProj='';
  ['招商局','特发集团','特发','高新投','高薪投','平安产险','中国平安'].forEach(p=>{ if(t.includes(p)) rawProj=p; });
  if(rawProj) project = normalizeProject(rawProj);
  getTypes().forEach(tp=>{ if(t.includes(tp)) type=tp; });
  if(type==='其他') type = detectType(t);
  const dates = extractDates(t);
  uploaded = dates.length>=1 ? dates[0] : todayStr();
  name = cleanDates(t)
          .replace(/招商局|特发集团|特发|高新投|高薪投|平安产险|中国平安/g,'')
          .replace(/调研类|文案撰写类|文案宣传类|设计类|执行协调类|其他/g,'')
          .replace(/\s+/g,'').trim() || t.slice(0,30);
  return {project,type,uploaded,name,url};
}

/* ============ 工作日志 ============ */
/* 操作类型 → 图标/动词 */
const LOG_ACTIONS = {
  add:{icon:'➕', verb:'新增', cls:'log-add'},
  update:{icon:'✏️', verb:'修改', cls:'log-upd'},
  delete:{icon:'🗑', verb:'删除', cls:'log-del'},
  file:{icon:'📎', verb:'文件', cls:'log-file'},
  report:{icon:'📋', verb:'报告', cls:'log-rep'},
  batch:{icon:'📦', verb:'批量', cls:'log-batch'}
};
/* 生成变更摘要短句（紧凑卡片用） */
function logChangeSummary(changes){
  if(!changes || !changes.length) return '';
  const parts = changes.slice(0,3).map(c=>{
    const label = LOG_FIELD_LABELS[c.field] || c.field;
    const from = c.from===''? '（空）' : c.from;
    const to = c.to===''? '（空）' : c.to;
    return `${label}: ${from} → ${to}`;
  });
  let s = parts.join(' · ');
  if(changes.length>3) s += ` · +${changes.length-3}项`;
  return s;
}
/* 渲染单条日志的紧凑卡片 */
function logCardHTML(l){
  const act = LOG_ACTIONS[l.action] || {icon:'•',verb:l.action,cls:''};
  const time = (l.ts||'').slice(11,16) || '';
  const proj = l.projectName ? `📂 ${esc(l.projectName)}` : '';
  const target = l.targetName ? esc(l.targetName) : '';
  const summary = (l.changes && l.changes.length) ? logChangeSummary(l.changes) : (l.summary||'');
  const linkable = (l.targetType==='task' && l.targetId) ? `data-logid="${l.id}"` : '';
  return `<div class="log-card ${act.cls}" ${linkable}>
    <div class="log-card-top">
      <span class="log-ic">${act.icon}</span>
      <span class="log-verb">${act.verb}</span>
      <span class="log-time">${time}</span>
    </div>
    <div class="log-card-proj">${proj}${target?`<span class="log-target">${target}</span>`:''}</div>
    ${summary?`<div class="log-card-sum">${esc(summary)}</div>`:''}
  </div>`;
}
/* 概况页紧凑行：时间 + 图标 + 项目·任务 + 改了什么 */
function logLineHTML(l){
  const act = LOG_ACTIONS[l.action] || {icon:'•',verb:l.action,cls:''};
  const time = (l.ts||'').slice(11,16) || '';
  const ctx = [l.projectName?`[${esc(l.projectName)}]`:'', l.targetName?`${esc(l.targetName)}`:''].filter(Boolean).join(' ');
  const summary = (l.changes && l.changes.length) ? logChangeSummary(l.changes) : (l.summary||'');
  const extra = summary? ` — ${esc(summary)}` : '';
  const linkable = (l.targetType==='task' && l.targetId) ? `data-logid="${l.id}"` : '';
  return `<div class="ov-log-row" ${linkable}><span class="ov-log-time">${time}</span><span class="ov-log-ic">${act.icon}</span><span class="ov-log-ctx">${ctx}</span><span class="ov-log-sum">${extra}</span></div>`;
}
/* 单条变更行（前 → 后） */
function diffRowHTML(c){
  const label = LOG_FIELD_LABELS[c.field] || c.field;
  const from = c.from===''? '<span class="empty">（空）</span>' : esc(c.from);
  const to = c.to===''? '<span class="empty">（空）</span>' : esc(c.to);
  return `<div class="diff-row"><span class="diff-field">${label}</span><span class="diff-from">${from}</span><span class="diff-arrow">→</span><span class="diff-to">${to}</span></div>`;
}
/* 单条当前值行（无前后对比时作兜底展示） */
function kvRowHTML(c){
  const label = LOG_FIELD_LABELS[c.field] || c.field;
  return `<div class="kv-row"><span class="kv-k">${label}</span><span class="kv-v">${esc(c.to||'（空）')}</span></div>`;
}
/* 点击卡片 → 放大详情（飞书式双栏雏形：左时间轴 + 右详情） */
function openLogDetail(l){
  const act = LOG_ACTIONS[l.action] || {icon:'•',verb:l.action,cls:''};
  let body = '';
  if(l.changes && l.changes.length){
    /* 新日志：直接展示「前 → 后」字段级对比 */
    body = `<div class="log-diff">${l.changes.map(diffRowHTML).join('')}</div>`;
  } else {
    /* 兜底：更早版本创建的日志未记录字段级变更；若仍关联到现存任务，展示其当前信息 */
    const t = (l.targetType==='task' && l.targetId) ? state.tasks.find(x=>x.id===l.targetId) : null;
    if(t){

const REPORT_TITLE = {daily:'日报', weekly:'周报', todo:'代办'};
function reportBlock(r){
  if(!r) return '';
  const t = REPORT_TITLE[r.type] || r.type;

  const c = r.content || {};
  const section = (label, txt) => txt ? `<div class="rb-sec"><span class="rb-lab">${label}</span><div class="rb-txt">${esc(txt)}</div></div>` : '';
  /* 代办：解析 JSON 左右分布展示 */
  if(r.type==='todo'){
    let td={today:'',week:''};
    try{ td=JSON.parse(c.todo||'{}'); }catch(e){ td.today=c.todo||''; }
    return `<div class="report-block">
      <div class="report-head"><span class="report-tag">${esc(t)}</span><span class="report-time">${esc(time)} 生成</span></div>
      <div style="display:flex;gap:16px">

  }
  return `<div class="report-block">
    <div class="report-head"><span class="report-tag">${esc(t)}</span><span class="report-time">${esc(time)} 生成</span></div>
    ${section('已交付', c.done)}
    ${section('进行中', c.doing)}
    ${section('未开始', c.todo)}
  </div>`;
}
function reportListHTML(){
  const confirmed = ['daily','weekly','todo']
    .map(tp => state.reports.filter(r=>r.type===tp && r.status==='confirmed').slice(-1)[0])
    .filter(Boolean);
  if(!confirmed.length) return '<p class="hint">尚未生成任何报告。用上方按钮生成日报 / 周报 / 代办。</p>';
  // 按生成时间倒序（最新在前）
  confirmed.sort((a,b)=> (b.confirmedAt||'').localeCompare(a.confirmedAt||''));
  return `<div class="report-list">${confirmed.map(reportBlock).join('')}</div>`;
}
function buildReport(type){
  const tasks = state.tasks;
  const today = todayStr();
  const wr = weekRange();
  const bullets = arr => arr.length? arr.map(t=>`• ${t.name}（${t.project}）`).join('\n') : '• （无）';

  if(type==='daily'){
    /* 日报标准：
       已交付：实际交付日期=今天 且 状态=已交付
       进行中：今天介于起始~预计交付之间 且 状态=进行中
       未开始：起始日期<今天 且 状态=未开始
    */
    const done = tasks.filter(t=> t.status==='已交付' && t.actual===today);
    const doing = tasks.filter(t=> t.status==='进行中' && t.start && t.due && t.start<=today && today<=t.due);
    const undone = tasks.filter(t=> t.status==='未开始' && t.start && t.start<today);
    return { done: bullets(done), doing: bullets(doing), todo: bullets(undone) };
  }

  if(type==='weekly'){
    /* 周报标准：
       已交付：实际交付日期在本周任意一天 且 状态=已交付
       进行中：周五日期介于起始~预计交付之间 且 状态=进行中
       未开始：状态=未开始
    */
    const done = tasks.filter(t=> t.status==='已交付' && t.actual && inWeek(t.actual));
    /* 周五日期 */
    const friDate = (()=>{ const d=new Date(wr.end); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
    const doing = tasks.filter(t=> t.status==='进行中' && t.start && t.due && t.start<=friDate && friDate<=t.due);
    const undone = tasks.filter(t=> t.status==='未开始');
    return { done: bullets(done), doing: bullets(doing), todo: bullets(undone) };
  }

  /* 代办标准：
     分本日 / 本周两部分，左右分布
     本日：实际交付日期=今天 且 状态=进行中或未开始
     本周：实际交付日期从今天到最近周五（含）且 状态=进行中或未开始
  */
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0=周日
  const daysToFri = dayOfWeek===0? 6 : (5-dayOfWeek); // 距离周五的天数
  const friOfThisWeek = new Date(now); friOfThisWeek.setDate(now.getDate()+daysToFri);
  const p=n=>String(n).padStart(2,'0');
  const fmtD=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const thisFri = fmtD(friOfThisWeek);

  const todayTasks = tasks.filter(t=> (t.status==='进行中'||t.status==='未开始') && t.actual===today );
  const weekTasks = tasks.filter(t=> (t.status==='进行中'||t.status==='未开始') && t.actual && t.actual>=today && t.actual<=thisFri );

  const bulletDetail = arr => arr.length? arr.map(t=>`• ${fmt(t.actual||t.due)} · ${t.name}（${t.project}）`).join('\n') : '• （无）';
  return {
    done:'', doing:'',
    todo: JSON.stringify({today:bulletDetail(todayTasks),week:bulletDetail(weekTasks)}),
    _raw: {today:todayTasks,week:weekTasks}
  };
}

/* 跳转后高亮目标任务条（闪烁两次，辅助定位） */
function highlightTaskRow(id){
  const find = ()=> document.querySelector(`#main tr[data-id="${id}"]`);
  let row = find();
  if(!row){
    /* 子任务可能处于折叠状态，展开其全部祖先后重试 */
    const t = state.tasks.find(x=>x.id===id);
    if(t){
      let cur=t, changed=false;
      while(cur && cur.related){
        if(!state.expandedParents.includes(cur.related)){ state.expandedParents.push(cur.related); changed=true; }
        cur = state.tasks.find(x=>x.id===cur.related);
      }
      if(changed){ save(); render(); row = find(); }
    }
  }
  if(!row) return;
  row.scrollIntoView({block:'center', behavior:'smooth'});
  row.classList.remove('flash');
  void row.offsetWidth; /* 重置动画以便重复触发 */
  row.classList.add('flash');
  row.addEventListener('animationend', ()=>row.classList.remove('flash'), {once:true});
}

function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let imported;
    try{ imported = JSON.parse(reader.result); }
    catch(e){ alert('文件不是有效的 JSON 备份'); return; }
    const payload = normalizeBackupPayload(imported);
    if(!payload){ alert('备份文件格式不正确（缺少 tasks 字段）'); return; }
    openImportChoice(payload);
  };
  reader.readAsText(file);
}
function normalizeBackupPayload(imported){
  if(imported && imported.state && Array.isArray(imported.state.tasks)){
    return { state: imported.state, ai: imported.ai || null };
  }
  if(imported && Array.isArray(imported.tasks)){
    return { state: imported, ai: imported.ai || null };
  }
  return null;
}
function openImportChoice(payload){
  const imported = payload.state;
  const cnt = k => Array.isArray(imported[k])?imported[k].length:0;
  const html = `<h3>导入备份</h3>

  openModal(html);

  });
  $('#impMerge').addEventListener('click', ()=>{
    if(payload.ai){ restoreAIData(payload.ai, true); }
    mergeState(imported); save(); closeModal(); render();
    alert('已合并导入：两份数据按 ID 拼合，重复 ID 以备份为准（AI 记忆按 ID 合并）。');
  });
}
/* 合并：各数组按 id 去重（同 id 以导入覆盖），projectOrder / customTypes 取并集 */
function mergeState(imported){
  const mergeArr = (key)=>{
    const cur = state[key] || [];
    const imp = imported[key] || [];
    const byId = new Map(cur.map(x=>[x.id, x]));
    imp.forEach(x=>{ if(x && x.id) byId.set(x.id, x); });
    state[key] = [...byId.values()];
  };
  ['tasks','files','logs','notes','reports'].forEach(mergeArr);
  if(Array.isArray(imported.projectOrder) && imported.projectOrder.length)
    state.projectOrder = [...new Set([...state.projectOrder, ...imported.projectOrder])];
  if(Array.isArray(imported.customTypes) && imported.customTypes.length)
    state.customTypes = [...new Set([...state.customTypes, ...imported.customTypes])];
  normalize();
}

/* ============ v7 碎碎念 AI 助手（BYOK + 透明 CORS 中继） ============ */
/* 设计：AI 配置与对话历史走独立 localStorage 键，不进 state、不进备份的 Key 字段，
   从而「版本升级 / 换设备导入」都不会覆盖 AI 记忆；对话记忆随备份迁移。 */
const AI_LS_CFG = 'campus_workbench_ai';
const AI_LS_CHAT = 'campus_workbench_ai_chat';
const AI_LS_CTX = 'campus_workbench_ai_ctx';  // 工作台快照：按对话固化，保证 system 前缀稳定以命中 DeepSeek 缓存

const AI_SYS_PROMPT = `你是「Work Buddy」的求职教练小助手，用户正在多项目并行备战校招/实习。
你已读到工作台的结构化现状（任务/进度/截止/难点/碎碎念）。
规则：
1. 用中文、口语化、像靠谱的学长；每次回答不超过 200 字，给可执行的下一步。
2. 主动点出卡点（停滞任务、临近截止、已知难点），但语气鼓励不制造焦虑。
3. 可基于难点给面试/笔试/简历的具体建议；被问到具体岗位时可模拟面试。
4. 不编造工作台没有的信息；不知道就说"工作台里没看到相关记录"。
5. 用户隐私优先：不主动复述敏感字段，不把内容外传。`;

function defaultAICfg(){ return { key:'', baseUrl:'', model:'deepseek-v4-pro', includeNotes:false }; }
function loadAICfg(){
  try{ const o = JSON.parse(localStorage.getItem(AI_LS_CFG)||'{}'); return Object.assign(defaultAICfg(), o); }
  catch(e){ return defaultAICfg(); }
}
function saveAICfg(cfg){ localStorage.setItem(AI_LS_CFG, JSON.stringify(cfg)); }
function loadChat(){
  try{ const a = JSON.parse(localStorage.getItem(AI_LS_CHAT)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function loadAICtx(){ try{ return localStorage.getItem(AI_LS_CTX)||''; }catch(e){ return ''; } }
function saveAICtx(s){ try{ if(s) localStorage.setItem(AI_LS_CTX, s); }catch(e){} }
function clearAICtx(){ try{ localStorage.removeItem(AI_LS_CTX); }catch(e){} }
function saveChat(arr){ localStorage.setItem(AI_LS_CHAT, JSON.stringify(arr.slice(-40))); }

/* 收集 AI 数据用于导出（不含 Key，防泄露；记忆随备份迁移） */
function collectAIData(){
  const cfg = loadAICfg();
  return { model: cfg.model, baseUrl: cfg.baseUrl, chat: loadChat() };
}
/* 从备份恢复 AI 数据；merge=true 时对话按内容去重合并 */
function restoreAIData(ai, merge){
  if(!ai) return;
  clearAICtx();   // 导入的对话视为新会话，下次发送重新快照当前工作台
  if(ai.model || ai.baseUrl){
    const cfg = loadAICfg();
    cfg.model = ai.model || cfg.model;
    cfg.baseUrl = ai.baseUrl || cfg.baseUrl;
    saveAICfg(cfg);   // 不恢复 Key（安全：需用户重新粘贴）
  }
  if(Array.isArray(ai.chat)){
    let chat = loadChat();
    if(merge){
      const seen = new Set(chat.map(m=>m.role+m.content));
      ai.chat.forEach(m=>{ const k=m.role+m.content; if(!seen.has(k)){ chat.push(m); seen.add(k); } });
    } else { chat = ai.chat; }
    saveChat(chat);
  }
}

function daysSince(d){ if(!d) return 999; const t = new Date(d.replace(' ', 'T')); if(isNaN(t)) return 999; return Math.max(0, Math.round((Date.now()-t)/864e5)); }
function daysUntil(d){ if(!d) return 999; const t = new Date(d.replace(' ', 'T')); if(isNaN(t)) return 999; return Math.round((t-Date.now())/864e5); }

/* 把 state 蒸馏成上下文包（仅在用户发消息时生成并发送） */
function buildContextPack(){
  const stuck = state.tasks.filter(t=> t.status==='进行中' && (daysSince(t.updatedAt)>3 || t.progress<50));
  const dueSoon = state.tasks.filter(t=> t.status!=='已交付' && daysUntil(t.due)<=3);
  const blockers = state.tasks.filter(t=> (t.feedback&&t.feedback.trim()) || /卡|难|不会|没时间|焦虑/.test(t.feedback||''));
  const todo = state.tasks.filter(t=> t.status==='未开始');
  const cfg = loadAICfg();
  const emo = cfg.includeNotes ? state.notes : state.notes.filter(n=> /累|焦虑|迷茫|不知道|好差|崩溃|放弃/.test(n.text));
  const line = t => `· [${t.project}] ${t.name}｜进度${t.progress}%｜状态${t.status}` + (t.due?`｜截止${t.due}`:'') + (t.feedback?`｜难点：${t.feedback}`:'');
  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.status==='已交付').length;
  const parts = [
    '# 工作台现状（自动生成，仅本次对话使用）',
    `## 整体进度：${done}/${total} 已交付`,
    '## 停滞/低进度任务', stuck.map(line).join('\n')||'（无）',
    '## 临近截止', dueSoon.map(line).join('\n')||'（无）',
    '## 已知卡点/难点', blockers.map(line).join('\n')||'（无）',
    '## 待办未开始', todo.map(line).join('\n')||'（无）',
    '## 近期碎碎念情绪线索', emo.map(n=>`· ${n.ts}：${n.text}`).join('\n')||'（无）',
    '## 最近操作', state.logs.slice(-8).map(l=>`· ${l.ts||''} ${l.text}`).join('\n')||'（无）'
  ];
  return parts.join('\n');
}

function renderAIPanel(){
  const cfg = loadAICfg();
  if(!cfg.key || !cfg.baseUrl){
    return `<div class="card ai-card"><div class="section-h">🤖 AI 小助手</div>
      <div class="ai-empty">尚未配置 AI。点右上角 <b>⚙ AI 设置</b> 粘贴你的 DeepSeek Key 与中继地址，助手就能读取你的全部工作台、主动提醒卡点。</div>
      <div style="text-align:right;margin-top:8px"><button class="btn sm" id="aiSet">去设置</button></div></div>`;
  }
  return `<div class="card ai-card"><div class="section-h">🤖 AI 小助手 · 已读你 ${state.tasks.length} 项任务</div>
    <div class="ai-quick">
      <button class="chip" data-q="帮我梳理当前卡点">梳理卡点</button>
      <button class="chip" data-q="给我今天的下一步建议">下一步建议</button>
      <button class="chip" data-q="模拟招商局终面的高频题并给作答思路">模拟面试</button>
    </div>
    <div class="ai-msgs" id="aiMsgs">${renderChat()}</div>
    <div class="ai-input"><textarea id="aiQ" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="btn sm" id="aiSend">发送</button></div>
    <div style="text-align:right;margin-top:6px"><button class="link" id="aiSet2">设置</button> · <button class="link" id="aiClear">清空对话</button></div>
  </div>`;
}
function renderChat(){
  const chat = loadChat();
  if(!chat.length) return '<div class="ai-row bot"><span class="who">助手</span>你好，我是你的求职教练。把卡点告诉我，或点上面的快捷提问试试。</div>';
  return chat.map(m=>`<div class="ai-row ${m.role==='user'?'user':'bot'}"><span class="who">${m.role==='user'?'你':'助手'}</span>${esc(m.content)}</div>`).join('');
}
function bindAIPanel(){
  const cfg = loadAICfg();
  const setBtn = document.getElementById('aiSet'); if(setBtn) setBtn.addEventListener('click', openAISettings);
  const setBtn2 = document.getElementById('aiSet2'); if(setBtn2) setBtn2.addEventListener('click', openAISettings);
  const clearBtn = document.getElementById('aiClear'); if(clearBtn) clearBtn.addEventListener('click', ()=>{ if(confirm('确定清空与 AI 的对话记忆？')){ saveChat([]); clearAICtx(); renderNotes(); } });
  if(!cfg.key || !cfg.baseUrl) return;
  document.querySelectorAll('#main .ai-quick .chip').forEach(c=> c.addEventListener('click', ()=> sendAI(c.dataset.q)));
  const send = document.getElementById('aiSend'); if(send) send.addEventListener('click', ()=>{ const v=document.getElementById('aiQ').value.trim(); if(v) sendAI(v); });
  const q = document.getElementById('aiQ'); if(q) q.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); const v=q.value.trim(); if(v) sendAI(v); } });
}
function appendMsg(role, content){
  const box = document.getElementById('aiMsgs'); if(!box) return;
  const div = document.createElement('div');
  div.className = 'ai-row ' + (role==='user'?'user':'bot');
  div.innerHTML = `<span class="who">${role==='user'?'你':'助手'}</span>`;
  div.appendChild(document.createTextNode(content));
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  return div;
}
async function sendAI(text){
  const box = document.getElementById('aiMsgs'); if(!box) return;
  appendMsg('user', text);
  const q = document.getElementById('aiQ'); if(q) q.value='';
  const botDiv = appendMsg('bot', '…');
  let shown = '';
  const setBotText = txt => {
    botDiv.innerHTML = '<span class="who">助手</span>';
    botDiv.appendChild(document.createTextNode(txt));
    box.scrollTop=box.scrollHeight;
  };
  const onToken = t => { shown += t; setBotText(shown); };
  const onDone = () => { renderNotes(); };
  const onErr = msg => { botDiv.className='ai-row err'; botDiv.textContent='⚠ '+msg; };
  await callAI(text, onToken, onDone, onErr);
}
async function callAI(userMsg, onToken, onDone, onErr){
  const cfg = loadAICfg();
  if(!cfg.key || !cfg.baseUrl){ onErr('未配置 API Key 或中继地址（点 ⚙ AI 设置）'); if(onDone) onDone(); return; }
  // 系统提示词保持恒定：上下文包仅在本段对话首条消息时快照一次并复用，
  // 避免每轮 system 变化导致 DeepSeek 前缀缓存命中失败（多轮“未命中缓存”报错 / 中断）。
  let ctx = loadAICtx();
  if(!ctx){ ctx = buildContextPack(); saveAICtx(ctx); }
  const sys = AI_SYS_PROMPT + '\n\n' + ctx;
  const hist = loadChat();
  const messages = [ ...hist, {role:'user', content:userMsg} ];
  try{
    const baseUrl = cfg.baseUrl.replace(/\/+$/,'').replace(/\/chat\/completions$/,'');
    const r = await fetch(baseUrl + '/chat/completions', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'authorization':'Bearer '+cfg.key },
      body: JSON.stringify({ model: cfg.model||'deepseek-v4-pro', messages:[{role:'system',content:sys}, ...messages], stream:true })
    });
    if(!r.ok){
      let detail = '';
      try{ detail = (await r.text()).slice(0,180); }catch(e){}
      onErr('API 返回 '+r.status+(detail?'：'+detail:'')+'（检查 Key / 中继地址 / 模型名）');
      return;
    }
    if(!r.body || !r.body.getReader){ onErr('当前环境不支持流式读取（SSE）'); return; }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf='', full='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const d = line.slice(5).trim(); if(d==='[DONE]') continue;
        try{
          const j=JSON.parse(d);
          if(j.error){ onErr('API 错误：'+(j.error.message||JSON.stringify(j.error))); return; }
          const t=j.choices?.[0]?.delta?.content||''; if(t){ full+=t; onToken(t); }
        }catch(e){}
      }
    }
    if(!full){ onErr('模型未返回内容（可能模型名错误或 Key 无权限）'); return; }
    hist.push({role:'user',content:userMsg},{role:'assistant',content:full});
    saveChat(hist);
    if(onDone) onDone();
  }catch(e){ onErr('网络 / CORS 错误：'+e.message+'（确认中继地址可访问）'); if(onDone) onDone(); }
}
function openAISettings(){
  const cfg = loadAICfg();
  const html = `<h3>🤖 AI 小助手设置</h3>
    <div class="setting-hint">Key 只保存在你本浏览器（localStorage），不会写入源码或备份；调用时会经你信任的中继转发到模型服务，中继应只转发请求并加 CORS 头，不存 Key、不存对话。</div>
    <div class="setting-row"><label>API Key（DeepSeek，以 sk- 开头）</label>
      <input id="aiKey" type="password" placeholder="sk-..." value="${esc(cfg.key)}"></div>
    <div class="setting-row"><label>中继地址（CORS 代理，以 https:// 开头，末尾不加 /chat/completions）</label>
      <input id="aiBase" placeholder="https://你的worker.dev" value="${esc(cfg.baseUrl)}"></div>
    <div class="setting-row"><label>模型</label>
      <input id="aiModel" placeholder="deepseek-v4-pro" value="${esc(cfg.model)}"></div>
    <div class="setting-row"><label><input type="checkbox" id="aiIncNotes" ${cfg.includeNotes?'checked':''}> 上下文包含碎碎念全文（默认仅情绪线索）</label></div>
    <div class="setting-hint">中继一键部署：Cloudflare Workers 粘贴 <code>项目资产/ai-proxy.js</code> 内容，绑定路由即可（免费）。</div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button class="btn sm" id="aiSave">保存</button>
      <button class="btn ghost sm" id="aiClear2">清空对话记忆</button>
      <button class="btn ghost sm" id="aiCancel">取消</button>
    </div>`;
  openModal(html);
  document.getElementById('aiCancel').addEventListener('click', closeModal);
  document.getElementById('aiClear2').addEventListener('click', ()=>{ if(confirm('清空对话记忆？')){ saveChat([]); clearAICtx(); closeModal(); renderNotes(); } });
  document.getElementById('aiSave').addEventListener('click', ()=>{
    const ncfg = { key: document.getElementById('aiKey').value.trim(), baseUrl: document.getElementById('aiBase').value.trim().replace(/\/+$/,'').replace(/\/chat\/completions$/,''), model: document.getElementById('aiModel').value.trim()||'deepseek-v4-pro', includeNotes: document.getElementById('aiIncNotes').checked };
    saveAICfg(ncfg);
    clearAICtx();
    closeModal();
    if(!ncfg.key || !ncfg.baseUrl) alert('已保存（尚未配置完整，AI 区会显示引导）。');
    else alert('AI 设置已保存。回到碎碎念页即可对话。');
    renderNotes();
  });
}

/* ============ 启动 ============ */
$('#aiSettingsBtn').addEventListener('click', openAISettings);
load();
go('overview');
