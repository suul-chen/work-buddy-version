<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校招项目全周期工作台</title>
<style>
:root{
  --bg:#efeae0; --panel:#ffffff; --ink:#0a0a0a; --sub:#6b6358;
  --line:#d9d3c4; --line2:#0a0a0a;
  --accent:#e63946; --accent2:#1d3557;
  --warm1:#ff8a3d; --warm2:#f25c1d;
  --cool1:#4dd0e1; --cool2:#06b6d4;
  --early:#facc15; --late:#3b82f6; --ontime:#9ca3af;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* sidebar */
.sidebar{width:240px;background:#0a0a0a;color:#f5f5f5;padding:24px 0;flex:0 0 240px;display:flex;flex-direction:column}
.brand{padding:0 24px 20px;color:#fff;border-bottom:1px solid #1f1f1f;margin-bottom:14px}
.brand .mark{font-weight:900;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .mark::before{content:'';width:12px;height:12px;background:var(--accent);display:inline-block}
.brand .sub{font-weight:400;font-size:10px;letter-spacing:2px;color:#999;margin-top:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 24px;color:#cfcfcf;text-decoration:none;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.3px;transition:background .18s ease,color .18s ease,padding-left .18s ease}
.nav a:hover{background:#161616;color:#fff;padding-left:28px}
.nav a.active{background:#fff;color:#0a0a0a;position:relative}
.nav a.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.nav .num{font-size:10px;color:#666;font-weight:800;width:22px;letter-spacing:1px}
.nav a.active .num{color:var(--accent)}
.subnav{list-style:none;margin:0;padding:6px 0;background:#050505;overflow:hidden;max-height:0;transition:max-height .3s ease}
.subnav:not(.hidden){max-height:400px}
.subnav li{padding:9px 24px 9px 52px;color:#888;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s,padding-left .15s}
.subnav li:hover{background:#111;color:#eee;padding-left:58px}
.subnav li.active{color:#fff;background:#0e0e0e}
.subnav li .grip{color:#555;cursor:grab;margin-left:-26px;font-size:14px}
.sidebar-foot{margin-top:auto;padding:18px 24px;border-top:1px solid #1a1a1a;font-size:10px;color:#666;letter-spacing:2px;font-weight:700}

/* main / page header */
main{flex:1;padding:36px 48px 56px;overflow:auto;max-width:100%}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.page-header .ph-issue{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--accent);margin-bottom:10px;text-transform:uppercase}
.page-header .ph-title{font-size:56px;line-height:1;font-weight:900;margin:0 0 10px;letter-spacing:-1px;color:var(--ink)}
.page-header .ph-meta{font-size:12px;color:var(--sub);letter-spacing:.5px}
.page-header .ph-right{text-align:right}
.page-header .ph-num{font-size:56px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-2px}
.page-header .ph-mark{font-size:14px;color:var(--ink);margin-top:6px;font-weight:800;letter-spacing:2px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;margin-bottom:18px;position:relative;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
.section-h{font-weight:800;margin:0 0 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
/* 报告列表 */
.report-list{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.report-block{border:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 14px;background:#fafaf6}
.report-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.report-tag{font-weight:800;font-size:13px;letter-spacing:1px;background:var(--ink);color:#fff;padding:2px 10px}
.report-time{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px}
.rb-sec{margin:6px 0;font-size:13px;line-height:1.5}
.rb-lab{display:inline-block;font-weight:800;font-size:11px;color:var(--accent);margin-right:6px;letter-spacing:1px}
.rb-txt{white-space:pre-wrap;color:var(--ink);margin-top:2px}
.section-h::before{content:'';width:10px;height:10px;background:var(--accent)}
.muted{color:var(--sub);font-size:12px}
.hint{font-size:12px;color:var(--sub);margin:6px 0;letter-spacing:.3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* quick entry */
.quick{display:flex;gap:10px;align-items:stretch}
.quick textarea{flex:1;height:68px;border:2px solid var(--ink);padding:12px 14px;font-size:14px;resize:none;font-family:inherit;background:#fff;transition:box-shadow .2s}
.quick textarea:focus{outline:0;box-shadow:5px 5px 0 var(--accent)}

/* buttons */
.btn{background:var(--ink);color:#fff;border:0;padding:10px 18px;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:1px;font-family:inherit;text-transform:uppercase;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.btn:hover{transform:translate(-1px,-2px);box-shadow:3px 3px 0 var(--accent)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.ok,.btn.warn{background:var(--accent);color:#fff;border:2px solid var(--accent)}
.btn.ok:hover,.btn.warn:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:6px 12px;font-size:10px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--ink);margin-bottom:18px;background:#fff}
.metric{padding:18px 20px;border-right:1px solid var(--ink);position:relative;background:#fff;transition:background .2s;cursor:pointer}
.metric:last-child{border-right:0}
.metric:hover{background:#fafaf6;box-shadow:inset 0 0 0 2px var(--accent)}
.metric .n{font-size:38px;font-weight:900;line-height:1;letter-spacing:-1px}
.metric .l{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);margin-top:8px;text-transform:uppercase}
.metric .acc{position:absolute;top:14px;right:14px;width:8px;height:8px;background:var(--accent)}
.metric.wide{grid-column:span 4;border-top:1px solid var(--ink);background:#0a0a0a;color:#fff}
.metric.wide .n{color:var(--accent)}
.metric.wide .l{color:#aaa}

/* timeline */
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:14px;align-items:flex-start}
ul.tl li:last-child{border-bottom:0}
ul.tl li .ts{color:var(--sub);font-size:11px;min-width:110px;font-weight:800;letter-spacing:1px}

/* pills */
.pill{display:inline-block;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:1px;border:1.5px solid var(--ink);background:#fff;margin-right:4px;text-transform:uppercase}
.pill.acc{border-color:var(--accent);color:var(--accent)}
.pill.ghost{border-color:var(--line);color:var(--sub)}
.st-未开始{border-color:var(--ink);color:var(--ink)}
.st-进行中{background:var(--ink);color:#fff;border-color:var(--ink)}
.st-已交付{background:var(--accent);color:#fff;border-color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;margin-right:8px;border:1.5px solid var(--ink);vertical-align:-1px}
.dot.d-已交付{background:var(--ink);border-color:var(--ink)}
.dot.d-进行中{background:var(--accent);border-color:var(--accent)}
.dot.d-未开始{background:#fff;border-color:var(--ink)}
.ver{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);background:#fff;border:1.5px solid var(--accent);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px;letter-spacing:.5px}

/* filter bar */
.filterbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:#fff;border:2px solid var(--ink);padding:16px 16px 16px 110px;margin-bottom:16px;position:relative}
.filterbar::before{content:'FILTERS';position:absolute;top:-2px;left:-2px;background:var(--ink);color:#fff;font-size:10px;letter-spacing:3px;padding:6px 10px;font-weight:800}
.filterbar .fl{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.filterbar select,.filterbar input[type=date]{border:2px solid var(--ink);padding:6px 10px;font-size:12px;font-family:inherit;background:#fff;border-radius:0}
.filterbar .sortbtn{cursor:pointer;border:2px solid var(--ink);padding:6px 12px;background:#fff;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:all .15s;font-family:inherit}
.filterbar .sortbtn:hover{background:var(--ink);color:#fff;transform:translate(-1px,-2px);box-shadow:3px 3px 0 var(--accent)}

/* table */
table.board{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink);font-size:12.5px;margin-bottom:16px}
table.board th,table.board td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;max-width:112px}
table.board td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 除任务名称外，每列最多显示约 8 个中文字（约 112px），超长截断加省略号；任务名列不限宽 */
table.board td.name-cell{max-width:none}
table.board thead th{border-bottom:2px solid var(--ink);font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase;background:#fafaf6;white-space:nowrap}
table.board tbody tr{transition:background .12s;cursor:pointer}
table.board tbody tr:hover{background:#fff8f5}
table.board tbody tr .tw-toggle,table.board tbody tr .btn{cursor:pointer}
a.file-link{color:var(--accent2);text-decoration:none;font-weight:600;transition:color .15s}
a.file-link:hover{color:var(--accent);text-decoration:underline}

/* progress */
.prog{height:8px;background:var(--line);width:96px;position:relative;overflow:hidden;border:1px solid var(--ink)}
.prog>i{display:block;height:100%;background:var(--ink);width:0;animation:progGrow .75s ease-out forwards;transform-origin:left}
@keyframes progGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* gantt — MS Project 风格（周 / 月） */
.gantt-toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;border-bottom:2px solid var(--ink);padding-bottom:10px;gap:10px;flex-wrap:wrap}
.gantt-title{font-size:20px;font-weight:800;letter-spacing:1px}
.gantt-timeline{position:relative;background:#fff;border:1.5px solid var(--ink);overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
.gantt-timeline:active{cursor:grabbing}
.gantt-timeline.dragging{cursor:grabbing}
.gantt-timeline.dragging .gantt-bar{pointer-events:none}
.gantt-inner{transition:transform .35s cubic-bezier(.25,.1,.25,1)}
.gantt-inner.dragging{transition:none}
.gantt-head{display:grid;background:#fafaf6;border-bottom:1.5px solid var(--ink);font-size:11px;font-weight:800;color:var(--ink)}
.gantt-head .cell{padding:8px 2px;text-align:center;border-right:1px solid var(--line);min-height:30px;display:flex;align-items:center;justify-content:center}
.gantt-head .cell.weekend{background:#ece6d8;color:var(--sub)}
.gantt-head .cell.today{background:var(--accent);color:#fff}
.gantt-rows{position:relative;min-height:60px}
.gantt-row{position:relative;height:36px;border-bottom:1px solid var(--line)}
.gantt-row:last-child{border-bottom:0}
.gantt-row.weekend{background:#fafaf6}
.gantt-bar{position:absolute;top:6px;height:24px;background:var(--accent);color:#fff;border-radius:4px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;box-shadow:0 2px 6px rgba(230,57,70,.28);overflow:hidden;white-space:nowrap;z-index:3;gap:6px}
.gantt-bar .lead{background:rgba(255,255,255,.22);border-radius:3px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:1px;flex:0 0 auto}
.gantt-bar .trail{margin-left:auto;background:rgba(255,255,255,.22);border-radius:3px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:1px;flex:0 0 auto}
.gantt-bar .name{overflow:hidden;text-overflow:ellipsis}
.gantt-bar .g-date{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:4;pointer-events:none}
.gantt-today-label{position:absolute;top:-2px;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;letter-spacing:1px;z-index:5;border-radius:2px}
.gantt-empty{padding:30px 20px;text-align:center;color:var(--sub);font-size:13px}
.gantt-add{display:block;margin:14px auto;padding:8px 22px;font-size:12px;font-weight:800;color:var(--ink);background:#fff;border:1.5px dashed var(--ink);cursor:pointer;letter-spacing:1px}
.gantt-add:hover{background:var(--ink);color:#fff}

/* tabs */
.tabs{display:inline-flex;border:2px solid var(--ink);margin-bottom:14px;overflow:hidden}
.tabs button{padding:7px 16px;background:#fff;color:var(--ink);border:0;border-right:2px solid var(--ink);cursor:pointer;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:background .15s,color .15s;font-family:inherit}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:#fafaf6}
.tabs button.on{background:var(--ink);color:#fff}

/* inputs / modal */
textarea.edit{width:100%;border:2px solid var(--ink);padding:10px;font-family:inherit;font-size:13px;resize:vertical;border-radius:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:2px;font-weight:800;color:var(--sub);margin-bottom:5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--ink);padding:8px 10px;font-size:13px;font-family:inherit;border-radius:0;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;box-shadow:4px 4px 0 var(--accent)}
.field textarea.auto-resize{resize:vertical;min-height:42px;overflow-y:hidden;line-height:1.5}
.field .req{color:var(--accent)}
.rel-cascade{display:flex;gap:8px;flex-wrap:wrap}
.rel-cascade select{flex:1 1 160px;min-width:0}
.rel-note{font-size:11px;font-weight:700;color:var(--accent);margin-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal-bg.show{display:flex;animation:fadeIn .2s ease}
.modal{background:#fff;border:2px solid var(--ink);padding:24px;width:600px;max-width:100%;position:relative;animation:modalIn .28s ease;box-shadow:8px 8px 0 var(--accent)}
.modal::before{content:'';position:absolute;top:-2px;left:-2px;width:48px;height:6px;background:var(--accent)}
.modal h3{margin:0 0 16px;font-size:22px;letter-spacing:-.5px;font-weight:900}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}

/* batch modal — wider, yellow uncertainty cells */
.modal.wide{width:880px;max-width:96vw}
.cell-warn{background:#fff3bf!important;box-shadow:inset 0 0 0 1.5px #e0a800}
.batch-summary{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--sub);margin:16px 0 10px;text-transform:uppercase}
.batch-summary b{color:var(--accent)}
.batch-cards{display:flex;flex-direction:column;gap:14px;max-height:54vh;overflow:auto;padding:2px}
.batch-card{border:2px solid var(--ink);background:#fff;padding:12px 14px;box-shadow:3px 3px 0 rgba(10,10,10,.10)}
.batch-card.batch-child{border-left:6px solid var(--accent);background:#faf6ee}
.batch-card .bc-line{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.batch-card .bc-content{margin-top:11px;padding-top:11px;border-top:1px dashed #d8cfbf}
.batch-card .bc-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.batch-card .bc-field label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--sub);text-transform:uppercase}
.batch-card .bc-name{flex:3 1 320px}
.batch-card .bc-req{flex:1 1 170px}
.batch-card .bc-rel{flex:1 1 150px}
.batch-card .bc-idx{font-size:15px;font-weight:900;color:var(--accent);align-self:center;min-width:22px}
.batch-card select,.batch-card input{border:1.5px solid var(--ink);padding:6px 8px;font-size:13px;font-family:inherit;background:#fff;border-radius:0;width:100%}
.batch-card .bc-field.warn select,.batch-card .bc-field.warn input{background:#fff3cd;border-color:#b8860b}
.batch-card.batch-child .bc-name label::after{content:' ↳ 子任务';color:var(--accent)}

/* route transition */
#main > *{animation:viewEnter .34s ease-out both}
@keyframes viewEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* misc */
.day-group{margin-bottom:18px;border-left:3px solid var(--ink);padding:6px 0 6px 14px;background:#fff}
.day-group .dh{font-weight:900;font-size:13px;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.day-group .dh::before{content:'◆';color:var(--accent);font-size:14px}
.ov-todo li b{color:var(--accent)}
.deco{display:flex;align-items:center;gap:10px;margin:10px 0 16px;color:var(--sub);font-size:11px;letter-spacing:3px;font-weight:800;text-transform:uppercase}
.deco::before,.deco::after{content:'';flex:1;border-top:2px solid var(--ink)}
.deco span{color:var(--accent)}


/* project picker */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-bottom:18px}
.proj-card{background:#fff;border:2px solid var(--ink);padding:20px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;position:relative;overflow:hidden}
.proj-card::before{content:'';position:absolute;top:-2px;left:-2px;width:42px;height:6px;background:var(--accent)}
.proj-card:hover{transform:translate(-2px,-3px);box-shadow:5px 5px 0 var(--accent)}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.pc-name{font-size:22px;font-weight:900;letter-spacing:-.5px}
.pc-num{font-size:34px;font-weight:900;color:var(--accent);line-height:1}
.pc-bar{height:10px;background:var(--line);border:1px solid var(--ink);margin:10px 0;overflow:hidden}
.pc-bar>i{display:block;height:100%;background:var(--ink);width:0;animation:progGrow .8s ease-out forwards;transform-origin:left}
.pc-meta{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--sub);text-transform:uppercase}
.pc-go{margin-top:12px;font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--ink)}

/* 项目右键菜单 */
.ctx-menu{position:fixed;z-index:80;background:#fff;border:2px solid var(--ink);min-width:172px;box-shadow:5px 5px 0 var(--accent);padding:6px;display:none}
.ctx-menu.show{display:block;animation:modalIn .12s ease}
.ctx-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);letter-spacing:.5px;border-radius:2px;font-family:inherit}
.ctx-menu button:hover{background:var(--accent);color:#fff}
.ctx-menu button.danger{color:#b00020}
.ctx-menu button.danger:hover{background:#b00020;color:#fff}
/* 导航右侧「＋」新建项目按钮 */
.nav-add{margin-left:auto;font-size:18px;line-height:1;font-weight:900;color:var(--accent);cursor:pointer;padding:0 4px 0 12px;user-select:none}
.nav-add:hover{color:var(--ink)}
/* 子导航底部「＋ 新建项目」 */
.subnav li.proj-add{color:var(--accent);font-weight:700}
.subnav li.proj-add:hover{color:#fff;background:var(--accent)}

/* 母/子任务树形 */
.board tr.child-row{background:#faf6ee}
.board tr.child-row .tw-indent{padding-left:calc(6px + var(--d,0)*22px)}
.board td.name-cell[data-toggle]{cursor:pointer}
.board .tw-indent{display:inline-flex;align-items:center}
.board .tw-toggle{font-weight:900;margin-right:5px;color:var(--accent);user-select:none}
.board .tw-toggle.dim{color:#c9bda8;margin-right:7px}
.board .tw-badge{font-size:10px;background:var(--accent);color:#fff;border-radius:9px;padding:1px 7px;margin-left:7px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.board .tw-child{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);background:#f0e6d6;padding:1px 7px;border-radius:9px;margin-right:6px}
.board td.act-cell .btn{margin:0}
/* 批量录入：选了母任务后缩进显示子任务 */
/* 甘特图：母任务汇总带 + 子任务缩进 */
.gantt-bar.summary{background:var(--accent);opacity:.5;border:1px dashed #fff;cursor:pointer;display:flex;align-items:center;gap:6px}
.gantt-bar.summary .name{font-weight:900}
.gantt-row.child .gantt-bar{margin-left:26px;width:auto}
/* 删除母任务弹窗：子任务勾选列表 */
.chk-list{display:flex;flex-direction:column;gap:9px;margin:14px 0;max-height:42vh;overflow:auto}
.chk{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* v6 visual direction: softer tool dashboard, function logic unchanged */
body{font-family:"Aptos","Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#f8f6ef}
.app{height:100vh;min-height:100vh;overflow:hidden;background:#f8f6ef}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#111519;color:#ede8dd;border-right:1px solid #29251f}
.brand{border-bottom:1px solid rgba(255,255,255,.12)}
.brand .mark{font-size:19px}
.brand .mark::before{border-radius:4px;background:#c75545}
.brand .sub{color:#aaa399;letter-spacing:1.5px}
.nav a{border-radius:15px;margin:4px 12px;padding:11px 12px 11px 14px;color:#c7c1b7;letter-spacing:0;text-transform:none}
.nav a:hover{background:rgba(255,255,255,.08);padding-left:18px;box-shadow:none}
.nav a.active{background:#f2ecdf;color:#111519}
.nav a.active::before{display:none}
.nav .num{font-family:ui-monospace,Menlo,Consolas,monospace;color:#cb5848}
main#main{height:100vh;overflow:auto;padding:30px 36px 48px;background:#f8f6ef}
.view-enter{animation:viewIn .28s ease both}
.wb-hero{display:grid;grid-template-columns:minmax(320px,1fr) 320px;gap:34px;align-items:end;margin-bottom:24px}
.wb-kicker{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#8d8378;margin-bottom:10px;letter-spacing:.06em}
.wb-word{font-family:Inter,"Arial Narrow",Arial,sans-serif;font-size:82px;line-height:.83;font-weight:850;letter-spacing:-.045em;margin:0;color:#131313}
.wb-word span{display:block}
.wb-copy{font-size:14px;line-height:1.75;color:#675f55;margin:18px 0 0;max-width:560px}
.wb-panel,.wb-stat,.wb-focus,.wb-col,.wb-todo-box{background:#fffdf8;border:1px solid #ded6c8;border-radius:18px}
.wb-focus{padding:18px;box-shadow:0 18px 40px rgba(24,24,24,.06)}
.wb-focus h2{font-size:15px;margin:0 0 10px}
.wb-focus strong{display:block;font-size:42px;line-height:1;margin:4px 0 8px;font-family:Inter,Arial,sans-serif}
.wb-focus p{font-size:13px;color:#766d63;line-height:1.65;margin:0}
.wb-entry-grid{display:grid;grid-template-columns:1.18fr .82fr;gap:14px;margin-bottom:18px}
.wb-panel{padding:16px;transition:transform .2s ease,box-shadow .2s ease}
.wb-panel:hover{transform:translateY(-1px);box-shadow:0 16px 38px rgba(24,24,24,.08)}
.wb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wb-head h3{font-size:15px;margin:0}
.wb-head span{font-size:12px;color:#867d72}
.wb-soft-input{width:100%;min-height:96px;border-radius:16px;border:1px solid #dcd3c5;background:#fbf8ef;padding:14px;color:#332e29;line-height:1.7;font-size:14px;font-family:inherit;resize:vertical}
.wb-soft-input:focus{outline:0;border-color:#c75545;box-shadow:0 0 0 4px rgba(199,85,69,.1)}
.wb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.wb-pill{border-radius:999px;background:#f0e6d9;color:#665d53;padding:4px 8px;font-size:11px}
.wb-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:30px}
.wb-stat{padding:15px}
.wb-stat b{display:block;font-size:28px;font-family:Inter,Arial,sans-serif;margin-bottom:4px}
.wb-stat span{font-size:12px;color:#7b7268}
.wb-section{margin-top:30px}
.wb-section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.wb-section-head h2{margin:0;font-family:Inter,Arial,sans-serif;font-size:38px;line-height:.95;letter-spacing:-.04em}
.wb-section-head span{font-size:13px;color:#80776c}
.wb-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wb-todo-box{padding:16px}
.wb-list{display:grid;gap:9px}
.wb-item{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid #eee5d8;background:#fbf8ef;border-radius:14px;font-size:13px}
.wb-date{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#8b8176}
.wb-report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wb-col{padding:16px;min-height:122px}
.wb-col h3{font-size:14px;margin:0 0 10px}
.wb-col .rb-txt,.wb-col p{font-size:13px;line-height:1.6;color:#4d4740;margin:0;white-space:pre-wrap}
.wb-editbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #eee5d8}
.wb-editbar p{margin:0;font-size:12px;color:#7f766c}
.wb-confirmed{display:inline-flex;align-items:center;gap:5px;color:#2d6b36;font-size:12px}
.wb-dyn{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee5d8;font-size:13px}
.wb-dyn:last-child{border-bottom:0}
.btn{border-radius:13px;text-transform:none;letter-spacing:0;box-shadow:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(20,20,20,.1)}
.btn.ghost{border:1px solid #d8d0c3;background:#fff;color:#25221f}
.btn.ok{background:#eff7ed;border-color:#c9dfc3;color:#2d6b36}
.btn.warn{background:#fff4e7;border-color:#ead4b9;color:#8a5a19}

/* soften the quick input and generated report blocks to match the dashboard */
.quick textarea{
  border:1px solid #dcd3c5;
  border-radius:20px;
  background:#fffdf8;
  min-height:88px;
  padding:16px 18px;
  box-shadow:0 12px 28px rgba(24,24,24,.04);
}
.quick textarea:focus{
  box-shadow:0 0 0 4px rgba(199,85,69,.1);
}
.report-list{
  gap:16px;
}
.report-block{
  background:#fffdf8;
  border:1px solid #e0d7c8;
  border-left:4px solid var(--accent);
  border-radius:20px;
  padding:16px 18px;
  box-shadow:0 12px 28px rgba(24,24,24,.05);
}
.report-head{
  margin-bottom:10px;
}
.report-tag{
  background:#f0e5d6;
  color:#1c1917;
  border:1px solid #d9cdbb;
  border-radius:999px;
  padding:3px 12px;
}
.report-time{
  font-size:11px;
  letter-spacing:.3px;
}
@media(max-width:960px){
  .app{height:auto;overflow:visible;display:block}
  .sidebar{position:relative;height:auto;width:auto;flex:auto}
  main#main{height:auto;overflow:visible;padding:22px}
  .wb-hero,.wb-entry-grid,.wb-two{grid-template-columns:1fr}
  .wb-strip,.wb-report-grid{grid-template-columns:1fr 1fr}
  .wb-word{font-size:56px}
}

/* v6 ui polish: existing structure only */
:root{
  --paper:#fffdf8;
  --paper2:#fbf8ef;
  --soft-line:#ded6c8;
  --soft-line2:#eee5d8;
  --soft-ink:#25221f;
  --soft-sub:#7b7268;
  --soft-red:#c75545;
  --soft-green:#2d6b36;
  --soft-yellow:#fff4d8;
}

/* windows / forms: polish the current HTML shape, do not impose a new template */
.modal-bg{
  align-items:flex-start;
  padding:34px 18px;
  background:rgba(22,20,17,.42);
  backdrop-filter:blur(14px);
}
.modal-bg.show{animation:fadeIn .18s ease}
.modal{
  width:620px;
  max-height:calc(100vh - 68px);
  overflow:auto;
  background:linear-gradient(180deg,#fffdf9 0%,#fbf8ef 100%);
  border:1px solid var(--soft-line);
  border-radius:26px;
  padding:24px;
  color:var(--soft-ink);
  box-shadow:0 26px 70px rgba(25,22,18,.22),0 2px 0 rgba(255,255,255,.9) inset;
  animation:modalIn .28s cubic-bezier(.2,.8,.2,1);
}
.modal::before{
  content:'';
  top:15px;
  left:24px;
  width:42px;
  height:5px;
  border-radius:999px;
  background:var(--soft-red);
  opacity:.86;
}
.modal h3{
  margin:0 0 18px;
  padding:16px 42px 16px 0;
  border-bottom:1px solid var(--soft-line2);
  font-family:Inter,"Arial Narrow",Arial,"Microsoft YaHei",sans-serif;
  font-size:28px;
  line-height:1.05;
  letter-spacing:-.035em;
  font-weight:850;
}
.modal.wide{width:min(1040px,96vw)}
.modal::-webkit-scrollbar,.batch-cards::-webkit-scrollbar,.chk-list::-webkit-scrollbar{width:10px;height:10px}
.modal::-webkit-scrollbar-thumb,.batch-cards::-webkit-scrollbar-thumb,.chk-list::-webkit-scrollbar-thumb{background:#d7cdbd;border-radius:999px;border:3px solid #fbf8ef}
.modal::-webkit-scrollbar-track,.batch-cards::-webkit-scrollbar-track,.chk-list::-webkit-scrollbar-track{background:transparent}

.field{margin-bottom:14px}
.field label{
  margin-bottom:6px;
  color:#8a8074;
  font-size:12px;
  letter-spacing:0;
  text-transform:none;
}
.field input,.field select,.field textarea,textarea.edit{
  border:1px solid var(--soft-line);
  border-radius:15px;
  background:rgba(255,255,255,.78);
  padding:11px 13px;
  color:var(--soft-ink);
  line-height:1.55;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease,transform .18s ease;
}
.field input:hover,.field select:hover,.field textarea:hover,textarea.edit:hover{background:#fff}
.field input:focus,.field select:focus,.field textarea:focus,textarea.edit:focus{
  outline:0;
  border-color:rgba(199,85,69,.72);
  box-shadow:0 0 0 4px rgba(199,85,69,.11);
  transform:translateY(-1px);
}
textarea.edit{min-height:150px;background:#fffdf8}
.rel-note,.hint{
  color:var(--soft-sub);
  line-height:1.65;
}
.modal .hint{
  background:rgba(255,255,255,.58);
  border:1px solid var(--soft-line2);
  border-radius:16px;
  padding:10px 12px;
}
.modal div[style*="text-align:right"]{
  position:sticky;
  bottom:-24px;
  margin:18px -24px -24px!important;
  padding:14px 24px;
  background:rgba(255,253,248,.92);
  border-top:1px solid var(--soft-line2);
  backdrop-filter:blur(10px);
  border-radius:0 0 26px 26px;
}

/* 指标卡详情弹窗 - 任务条表格 */
.dt-table{max-height:55vh;overflow-y:auto;padding:4px 0}
.dt-head{display:grid;grid-template-columns:2fr 1.5fr 100px 100px 100px;gap:8px;padding:8px 12px;background:#f5f0e6;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--sub);border-bottom:2px solid var(--ink);text-transform:uppercase}
.dt-row{display:grid;grid-template-columns:2fr 1.5fr 100px 100px 100px;gap:8px;padding:10px 12px;border-bottom:1px solid #ede5d5;align-items:center;transition:background .15s}
.dt-row:hover{background:#faf6ee}
.dt-row .dt-name{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-row .dt-req,.dt-row .dt-del{font-size:11px;color:#7a7066;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-row .dt-date{font-size:11px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.dt-row .dt-actual{color:var(--ok);font-weight:700}
.dt-section{margin-bottom:8px}
.dt-st-header{padding:10px 12px 6px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);margin-top:8px}
.dt-section:first-child .dt-st-header{margin-top:0}
.dt-proj-group{margin-bottom:4px}
.dt-proj-name{padding:6px 12px;font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.5px;background:rgba(230,57,70,.06);border-radius:6px;margin:6px 0 2px}

/* 代办弹窗 - 左右分布 */
.todo-split{display:flex;gap:16px}
.todo-col{flex:1;display:flex;flex-direction:column;gap:6px}
.todo-label{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--ink);text-transform:uppercase}

/* ============ 工作日志（飞书式小卡片 + 放大详情） ============ */
.log-filters{display:flex;gap:6px;flex-wrap:wrap}
.logf{border:1px solid #d8d0c3;background:#fffdf8;color:#5a534a;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.logf:hover{border-color:var(--accent)}
.logf.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:8px}
.log-card{border:1.5px solid #e3dccd;background:#fff;border-radius:14px;padding:11px 13px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.log-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.log-card.log-add::before{background:#2f9e44}
.log-card.log-upd::before{background:#1971c2}
.log-card.log-del::before{background:#e03131}
.log-card.log-file::before{background:#f08c00}
.log-card.log-rep::before{background:#7048e8}
.log-card.log-batch::before{background:#0c8599}
.log-card:hover{box-shadow:0 8px 20px rgba(20,20,20,.08);transform:translateY(-2px)}
.log-card-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.log-ic{font-size:13px}
.log-verb{font-size:12px;font-weight:800;color:var(--ink)}
.log-time{margin-left:auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.log-card-proj{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.log-target{color:var(--ink);font-weight:700;font-size:12px}
.log-card-sum{margin-top:6px;font-size:11px;color:#6b6358;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 放大详情 */
.log-detail-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px;font-size:12px}
.log-dt-name{font-weight:800;color:var(--ink)}
.log-diff{display:flex;flex-direction:column;gap:8px}
.diff-row{display:flex;align-items:center;gap:10px;background:#faf7f0;border:1px solid #ece4d6;border-radius:10px;padding:9px 12px;font-size:12px}
.diff-field{flex:0 0 92px;font-weight:800;color:var(--ink)}
.diff-from{color:#86807a;text-decoration:line-through;text-decoration-color:#d0c9bd}
.diff-arrow{color:var(--accent);font-weight:900}
.diff-to{color:var(--ink);font-weight:700}
.diff-row .empty{color:#bbb;font-style:italic}
.log-sum-only{background:#faf7f0;border:1px solid #ece4d6;border-radius:10px;padding:12px;font-size:13px;line-height:1.6;color:#4a443c}
.log-dt-sum{background:#f6f8fb;border:1px solid #e6ecf3;border-radius:10px;padding:9px 12px;margin:10px 0 2px;font-size:13px;color:#3a4a5a;line-height:1.6}
.log-note{font-size:12px;color:#86807a;margin:2px 0 8px;line-height:1.5}
.log-kv{display:flex;flex-direction:column;gap:6px}
.kv-row{display:flex;align-items:center;gap:10px;background:#faf7f0;border:1px solid #ece4d6;border-radius:10px;padding:7px 12px;font-size:12px}
.kv-k{flex:0 0 92px;font-weight:800;color:var(--ink)}
.kv-v{color:var(--ink)}

/* 跳转后目标任务条闪烁定位（两次，等速） */
@keyframes rowFlash{
  0%,100%{ background:#fff; box-shadow:none; }
  50%{ background:rgba(230,57,70,.30); box-shadow:0 0 0 2px var(--accent), 0 0 14px rgba(230,57,70,.35); }
}
tr.flash{ animation:rowFlash .55s ease 2; }

/* 概况页最近动态紧凑行 */
.ov-log-list{display:flex;flex-direction:column;gap:2px}
.ov-log-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s;font-size:12px}
.ov-log-row:hover{background:#faf6ee}
.ov-log-time{color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 42px}
.ov-log-ic{flex:0 0 auto;font-size:13px}
.ov-log-ctx{flex:0 0 auto;font-weight:800;color:var(--ink);max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-log-sum{flex:1;color:#6b6358;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* controls */
.btn{
  border-radius:999px;
  font-weight:800;
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(20,20,20,.11)}
.btn.sm{padding:7px 13px;font-size:11px}
.btn.ghost{border:1px solid #d8d0c3;background:#fffdf8;color:#2d2925}
.btn.ghost:hover{border-color:#bfb3a3;background:#fff;color:#111}
.btn.ok{background:#eef7ec;border-color:#c7dfc1;color:var(--soft-green)}
.btn.warn{background:#fff2e4;border-color:#ead1b4;color:#905f19}

/* filters and view tabs */
.filterbar{
  gap:10px 12px;
  align-items:center;
  background:#fffdf8;
  border:1px solid var(--soft-line);
  border-radius:22px;
  padding:13px 14px;
  box-shadow:0 12px 28px rgba(24,24,24,.045);
}
.filterbar::before{content:none}
.filterbar .fl{
  color:#8a8074;
  font-size:12px;
  letter-spacing:0;
  text-transform:none;
}
.filterbar select,.filterbar input[type=date],.filterbar .sortbtn{
  border:1px solid #d8d0c3;
  border-radius:999px;
  background:#fff;
  padding:7px 12px;
  color:#2e2924;
}
.filterbar .sortbtn:hover{
  background:#111519;
  color:#fff;
  transform:translateY(-1px);
  box-shadow:0 10px 20px rgba(17,21,25,.12);
}
.tabs{
  border:1px solid var(--soft-line);
  border-radius:999px;
  overflow:hidden;
  background:#fffdf8;
  box-shadow:0 12px 24px rgba(24,24,24,.04);
}
.tabs button{
  border-right:1px solid var(--soft-line);
  padding:8px 18px;
  letter-spacing:0;
  text-transform:none;
  background:transparent;
}
.tabs button.on{background:#111519;color:#fff}

/* task/file tables: keep the existing columns and tree logic, only improve reading */
table.board{
  border:0;
  border-collapse:separate;
  border-spacing:0 8px;
  background:transparent;
  font-size:13px;
}
table.board thead th{
  position:sticky;
  top:0;
  z-index:4;
  border:0;
  background:#f8f6ef;
  color:#82786d;
  padding:8px 12px;
  font-size:12px;
  letter-spacing:0;
  text-transform:none;
  font-weight:800;
}
table.board tbody tr{
  background:#fffdf8;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
table.board tbody tr:hover{
  background:#fff;
  transform:translateY(-1px);
  box-shadow:0 14px 30px rgba(24,24,24,.07);
}
table.board th,table.board td{
  border-bottom:1px solid var(--soft-line2);
  padding:12px 13px;
  vertical-align:middle;
}
table.board tbody td:first-child{
  border-left:1px solid var(--soft-line2);
  border-radius:15px 0 0 15px;
}
table.board tbody td:last-child{
  border-right:1px solid var(--soft-line2);
  border-radius:0 15px 15px 0;
}
table.board .name-cell{
  max-width:360px;
  font-weight:800;
  color:#211f1c;
}
table.board .act-cell{
  min-width:128px;
  white-space:nowrap;
}
.board tr.child-row{background:#fbf3e9}
.board tr.child-row:hover{background:#fff7ed}
.board .tw-indent{gap:4px}
.board .tw-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:21px;
  height:21px;
  margin-right:3px;
  border-radius:999px;
  background:#f1e7dc;
  color:var(--soft-red);
}
.board .tw-toggle.dim{background:transparent;color:#c7baaa}
.board .tw-badge,.board .tw-child,.ver{
  border-radius:999px;
  border:0;
  padding:2px 8px;
}
.board .tw-badge{background:#efe5d8;color:#805044}
.board .tw-child{background:#fff0e1;color:#9a5d21}
.ver{background:#f2ece0;color:#9a5144}

.pill{
  border:1px solid #ded5c8;
  border-radius:999px;
  background:#fff;
  color:#62594f;
  padding:3px 9px;
  letter-spacing:0;
  text-transform:none;
}
.dot{
  width:9px;
  height:9px;
  border-radius:999px;
  border:0;
  box-shadow:0 0 0 3px rgba(0,0,0,.04);
}
.dot.d-\5DF2\4EA4\4ED8{background:#589b63}
.dot.d-\6B63\5728\8FDB\884C{background:#c75545}
.dot.d-\672A\5B8C\6210{background:#d8c8b5}
.prog{
  width:90px;
  height:7px;
  border:0;
  border-radius:999px;
  background:#eee5d8;
}
.prog>i{border-radius:999px;background:#111519}

/* batch preview keeps its own current structure */
.batch-summary{
  color:#7c7368;
  letter-spacing:0;
  text-transform:none;
}
.batch-cards{
  max-height:52vh;
  padding:4px 2px 10px;
}
.batch-card{
  border:1px solid var(--soft-line);
  border-radius:20px;
  background:#fffdf8;
  padding:14px;
  box-shadow:0 12px 28px rgba(24,24,24,.055);
}
.batch-card.batch-child{
  border-left:4px solid var(--soft-red);
  background:#fff7ed;
}
.batch-card .bc-content{
  border-top:1px solid var(--soft-line2);
}
.batch-card .bc-field label{
  color:#8a8074;
  letter-spacing:0;
  text-transform:none;
}
.batch-card select,.batch-card input{
  border:1px solid var(--soft-line);
  border-radius:13px;
  background:#fff;
  padding:8px 10px;
}
.batch-card .bc-field.warn select,.batch-card .bc-field.warn input{
  background:var(--soft-yellow);
  border-color:#e2bd70;
}
.cell-warn{background:var(--soft-yellow)!important;box-shadow:inset 0 0 0 1px #e2bd70}

/* small menus / check lists */
.ctx-menu{
  border:1px solid var(--soft-line);

  padding:7px;
  box-shadow:0 20px 42px rgba(24,24,24,.18);

  background:#fffdf8;

}
.chk{
  padding:9px 10px;
  border-radius:13px;
}
.chk:hover{background:#f5eee3}

/* roadmap density pass: keep the given table logic, make it usable at normal zoom */

  padding-right:24px;
}
main#main:has(table.board) .page-header{
  margin-top:28px;
}
main#main:has(table.board) .filterbar{
  position:relative;
  top:auto;
  z-index:1;
  border-radius:22px;
}
table.board{
  table-layout:fixed;
  width:100%;
}
table.board thead{
  position:sticky;
  top:0;
  z-index:60;
}
table.board thead tr{
  position:relative;
  z-index:61;

  top:0;

}
.pill{

/* softer native select treatment for recognition/editing windows */
.modal select,
.batch-card select,
.filterbar select{
  appearance:none;
  -webkit-appearance:none;
  padding-right:34px;
  background-image:
    linear-gradient(45deg,transparent 50%,#6f675d 50%),
    linear-gradient(135deg,#6f675d 50%,transparent 50%);
  background-position:
    calc(100% - 18px) 50%,
    calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}
.modal select:focus,
.batch-card select:focus{
  border-color:#cfc4b6;
  box-shadow:0 0 0 4px rgba(88,120,95,.10);
}
.modal select option,
.batch-card select option,
.filterbar select option{
  background:#fffdf8;
  color:#25221f;
}

/* exact table display rules: task name clipped to 10 chars, type full, requirement clipped to 8 chars */
table.board{table-layout:fixed}
table.board td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.board .name-cell{
  width:360px;
  max-width:360px;

  text-overflow:clip;
  white-space:nowrap;
  line-height:1.45;

/* custom rounded dropdown for task recognition */

  width:100%;

<script>
/* ============ 常量 ============ */
/* 默认类型列表（可被 state.customTypes 覆盖） */
const DEFAULT_TYPES = ['调研类','文案撰写类','文案宣传类','设计类','执行协调类','其他'];
function getTypes(){ return (state && state.customTypes && state.customTypes.length) ? state.customTypes : DEFAULT_TYPES; }
const STATUSES = ['未开始','进行中','已交付'];
const OWNER_DEFAULT = '陈世维';
const YEAR = 2026;
/* 星期映射：周一=1 … 周日=0（与 JS getDay 对齐） */
const WD = {'日':0,'周日':0,'一':1,'周一':1,'二':2,'周二':2,'三':3,'周三':3,'四':4,'周四':4,'五':5,'周五':5,'六':6,'周六':6};
/* 项目别名表：模糊词归一（"特发"=="特发集团"，"高薪投"=="高新投"，"平安产险"=="中国平安"） */
const PROJECT_ALIASES = {
  '特发':'特发集团','特发集团':'特发集团',
  '高薪投':'高新投','高新投':'高新投',
  '平安产险':'中国平安','中国平安':'中国平安'
};
/* 类型别名表：口语/缩写 → 标准类型（校招启动文/校招简章/启动文/简章 → 文案宣传类；ppt/呈现 → 设计类 …） */
const TYPE_ALIASES = {
  '校招启动文':'文案宣传类','校招简章':'文案宣传类','启动文':'文案宣传类','简章':'文案宣传类',
  '推文':'文案宣传类','海报':'文案宣传类','宣传':'文案宣传类','物料':'文案宣传类','折页':'文案宣传类','推荐':'文案宣传类',
  'ppt':'设计类','呈现':'设计类','设计稿':'设计类','排版':'设计类',
  '调研':'调研类','研究':'调研类','调研报告':'调研类',
  '话术':'文案撰写类','文案':'文案撰写类','撰写':'文案撰写类',
  '跟进':'执行协调类','邮件':'执行协调类','贴':'执行协调类','协调':'执行协调类','执行':'执行协调类','对接':'执行协调类'
};
/* 日期正则：约束月 1-12、日 1-31，长匹配优先（避免把"27"误拆为"2"+余"7"），避免误吞"40-50元/份"等数值区间 */
const MD_SRC = '(1[0-2]|[1-9])\\s*[月\\.\\/\\-]\\s*([12]\\d|3[01]|[1-9])';

/* ============ 状态 ============ */
let state = null;
const LS_KEY = 'campus_workbench_v1';

function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ state = JSON.parse(raw); normalize(); return; }catch(e){} }
  state = seed();
  save();
}
function normalize(){
  if(!Array.isArray(state.tasks)) state.tasks = [];
  if(!Array.isArray(state.files)) state.files = [];
  if(!Array.isArray(state.notes)) state.notes = [];
  if(!Array.isArray(state.reports)) state.reports = [];
  state.fileFilters = Object.assign({project:'all',type:'all',asc:true}, state.fileFilters||{});
  state.filters = Object.assign({type:'all',dueBefore:'',status:'all',startFrom:''}, state.filters||{});
  if(!Array.isArray(state.projectOrder)) state.projectOrder = [];
  if(!Array.isArray(state.expandedParents)) state.expandedParents=[];
  if(!state.ganttAnchor) state.ganttAnchor=todayStr();
  if(!Array.isArray(state.customTypes)) state.customTypes = [];
  if(!Array.isArray(state.logs)) state.logs = [];
  state.logs.forEach(l=>{
    if(l.targetType===undefined) l.targetType = (l.taskId? 'task' : 'report');
    if(l.targetId===undefined) l.targetId = l.taskId||'';
    if(l.targetName===undefined) l.targetName = (l.text||'').replace(/^[【\[].*?[\]】]\s*/, '').replace(/^[添加修改删除].*?《|》.*$/g,'') || (l.text||'');
    if(l.projectName===undefined) l.projectName = '';
    if(!Array.isArray(l.changes)) l.changes = [];
    if(l.summary===undefined) l.summary = l.text||'';
  });
  state.files.forEach(f=>{ if(f.url===undefined) f.url=''; });
  state.tasks.forEach(t=>{
    if(!Array.isArray(t.linkedFiles)) t.linkedFiles=[];
    if(t.related===undefined) t.related='';
    if(t.version===undefined) t.version='';
    if(t.feedback===undefined) t.feedback='';
    /* 字段演进：任务内容→任务名称(name) + 任务要求(requirement)；周期(cycle)不再展示 */
    if(t.name===undefined) t.name='';
    if(t.requirement===undefined) t.requirement='';
    if(t.project) t.project=normalizeProject(t.project);
    if(t.type) t.type=normalizeType(t.type);
  });
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  if(typeof clearAICtx === 'function') clearAICtx();
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ============ 种子数据（按照片字段：招商局 / 特发集团） ============ */
function seed(){
  const t = (o)=>Object.assign({id:uid(),progress:0,deliverable:'',related:'',version:'',feedback:'',difficulty:'',owner:OWNER_DEFAULT,status:'未开始',createdAt:nowISO(),updatedAt:nowISO()}, o);
  const tasks = [
    t({name:'完成磷酸铁锂电池行业研究报告',type:'调研类',project:'招商局',start:'2026-07-06',due:'2026-07-10',actual:'2026-07-09',progress:100,deliverable:'行业研究报告PPT',difficulty:'一手数据难获取→已联系学长',status:'已交付'}),
    t({name:'整理招商局面试话术',type:'文案撰写类',project:'招商局',start:'2026-07-08',due:'2026-07-12',actual:'2026-07-14',progress:100,deliverable:'面试话术文档',difficulty:'表达不流畅→多次录音复盘',status:'已交付'}),

    t({name:'招商局宣讲会物料设计',type:'文案宣传类',project:'招商局',start:'2026-07-18',due:'2026-07-25',progress:40,deliverable:'宣讲会海报/折页',status:'进行中'}),
    t({name:'特发集团业务调研',type:'调研类',project:'特发集团',start:'2026-07-06',due:'2026-07-09',actual:'2026-07-09',progress:100,deliverable:'业务调研表',status:'已交付'}),
    t({name:'特发集团推文撰写',type:'文案撰写类',project:'特发集团',start:'2026-07-10',due:'2026-07-14',progress:50,deliverable:'公众号推文',status:'进行中'}),
    t({name:'特发集团数据整理',type:'执行协调类',project:'特发集团',start:'2026-07-20',due:'2026-07-24',progress:0,deliverable:'数据汇总表',status:'未开始'}),
    t({name:'特发集团宣传视频脚本',type:'文案宣传类',project:'特发集团',start:'2026-07-22',due:'2026-07-28',progress:10,deliverable:'视频脚本',difficulty:'创意卡壳→参考竞品',status:'未开始'})
  ];
  const logs = [
    l('2026-07-06 09:12','add','','新增任务《完成磷酸铁锂电池行业研究报告》（招商局）'),
    l('2026-07-08 14:30','add','','新增任务《整理招商局面试话术》（招商局）'),
    l('2026-07-09 18:05','done','','交付《磷酸铁锂电池行业研究报告》，提前1天'),
    l('2026-07-10 10:00','add','','新增任务《特发集团业务调研》'),
    l('2026-07-14 20:10','done','','交付《招商局面试话术》，延期2天'),
    l('2026-07-15 09:00','add','','新增任务《招商局终面PPT制作》'),
    l('2026-07-20 11:00','add','','新增任务《特发集团数据整理》')
  ];
  const notes = [
    {id:uid(),ts:'2026-07-12 21:40',text:'突然想到可以用 SWOT 框架重做招商局那页'},
    {id:uid(),ts:'2026-07-19 08:15',text:'宣讲会物料统一用蓝色主视觉，和招商局区分开'}
  ];
  const files = [
    {id:uid(),name:'磷酸铁锂行业研究报告PPT',project:'招商局',type:'调研类',uploaded:'2026-07-09',note:'终版',url:'',createdAt:nowISO()},
    {id:uid(),name:'25年招商局启动文（终稿）',project:'招商局',type:'文案撰写类',uploaded:'2026-07-27',note:'飞书在线文档，点击可预览',url:'https://ncn7xrcttx8x.feishu.cn/docx/DetldpI1Jo0VsTxTvEAcmSETnXf',createdAt:nowISO()},
    {id:uid(),name:'招商局面试话术文档',project:'招商局',type:'文案撰写类',uploaded:'2026-07-14',note:'含复盘',url:'',createdAt:nowISO()},
    {id:uid(),name:'特发集团业务调研表',project:'特发集团',type:'调研类',uploaded:'2026-07-09',note:'',url:'',createdAt:nowISO()},
    {id:uid(),name:'特发集团推文 v1',project:'特发集团',type:'文案撰写类',uploaded:'2026-07-13',note:'待审',url:'',createdAt:nowISO()}
  ];
  return {tasks,logs,notes,reports:[],files,projectOrder:['招商局','特发集团'],
    filters:{type:'all',dueBefore:'',status:'all',startFrom:''},
    fileFilters:{project:'all',type:'all',asc:true},
    expandedParents:[],
    customTypes:['调研类','文案撰写类','文案宣传类','设计类','执行协调类','其他'],
    roadmapSort:'asc', roadmapView:'board', ganttAnchor:todayStr(), currentProject:'all'};
}
function l(ts,action,taskId,text){ return {id:uid(),ts,action,taskId,text}; }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function weekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=周日
  const diffToMon = (day===0? -6 : 1-day);
  const mon = new Date(now); mon.setDate(now.getDate()+diffToMon); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  const f = d=>{ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
  return {start:f(mon), end:f(sun)};
}
function inWeek(d){ if(!d) return false; const {start,end}=weekRange(); return d>=start && d<=end; }

/* ============ 工具 ============ */
function $(s,r=document){ return r.querySelector(s); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(d){ if(!d) return '—'; const a=d.split('-'); return a.length===3?`${+a[1]}/${+a[2]}`:d; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function diffDays(task){ return daysBetween(task.due, task.actual); } // 负=提前
function projects(){ return state.projectOrder.slice(); }
function projectExists(p){ return state.projectOrder.includes(p); }

/* ============ 模糊索引 / 别名归一 ============ */
function normalizeProject(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  if(PROJECT_ALIASES[raw]) return PROJECT_ALIASES[raw];      // 直接命中别名
  if(projectExists(raw)) return raw;                         // 已是规范名
  const cands = state ? state.projectOrder : [];
  for(const c of cands){ if(c && (c.includes(raw) || raw.includes(c))) return c; } // 模糊包含
  for(const k in PROJECT_ALIASES){ if(raw.includes(k) || k.includes(raw)) return PROJECT_ALIASES[k]; }
  return raw;                                               // 全新项目，原样保留
}
function normalizeType(raw){
  if(!raw) return '其他';
  raw = String(raw).trim();
  if(getTypes().includes(raw)) return raw;
  if(TYPE_ALIASES[raw]) return TYPE_ALIASES[raw];
  for(const k in TYPE_ALIASES){ if(raw.includes(k)) return TYPE_ALIASES[k]; }
  return raw;
}
/* 从文本抽取全部 M.D 日期（约束月/日范围），返回 YYYY-MM-DD 数组 */
function extractDates(text){
  const re = new RegExp(MD_SRC,'g'); const out=[]; let m;
  while((m=re.exec(text))){ out.push(`${YEAR}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`); }
  return out;
}
/* 去除文本中的显式日期（含括号日期） */
function cleanDates(text){
  return text.replace(new RegExp('[（(]\\s*'+MD_SRC+'\\s*[）)]','g'),'')
             .replace(new RegExp(MD_SRC,'g'),'');
}
/* 把"周X"解析为相对 refDate 的下一个该星期几（含今天） */
function resolveWeekday(wd, refStr){
  const ref = new Date(refStr + 'T00:00:00');
  const target = WD[wd];
  let diff = (target - ref.getDay() + 7) % 7;
  const d = new Date(ref); d.setDate(ref.getDate()+diff);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
/* 类型启发式（单条/批量共用）：显式类型名 > 别名 > 关键词 */
function detectType(text){
  for(const tp of getTypes()){ if(text.includes(tp)) return tp; }
  for(const k in TYPE_ALIASES){ if(text.includes(k)) return TYPE_ALIASES[k]; }
  if(/ppt|呈现|排版|设计/.test(text)) return '设计类';
  if(/调研|研究/.test(text)) return '调研类';
  if(/邮件|贴|跟进|协调|执行|对接/.test(text)) return '执行协调类';
  if(/推荐|宣传|推文|海报|物料|折页/.test(text)) return '文案宣传类';
  if(/话术|文案|撰写/.test(text)) return '文案撰写类';
  return '其他';
}
/* 在任务行内嗅探项目名：已知项目/别名优先；否则把行首的专有名词当作新项目 */
function findInlineProject(line, discovered){
  const pool = new Set([...(state?state.projectOrder:[]), ...Object.keys(PROJECT_ALIASES), ...Object.values(PROJECT_ALIASES), ...(discovered||[])]);
  let best='', bestLen=0;
  for(const c of pool){ if(c && line.includes(c) && c.length>bestLen){ best=c; bestLen=c.length; } }
  if(best) return normalizeProject(best);
  const m = line.replace(/周[一二三四五六日]\s*[-~～]\s*周[一二三四五六日]/g,'').trim().match(/^([一-龥]{2,6})\s+([一-龥A-Za-z].+)$/);
  if(m){
    const tok = m[1];
    const VERBS = ['跟进','整理','协调','执行','对接','完成','制作','撰写','调研','研究','推荐','设计','呈现','上传','准备','确认','联系','发送','回复','处理','目标'];
    if(!VERBS.some(v=>tok.startsWith(v))) return tok; // 行首非动词 → 视为项目名
  }
  return '';
}

/* 字段中文标签（用于日志 diff 展示） */
const LOG_FIELD_LABELS = {
  name:'任务名称', requirement:'任务要求', type:'任务类型', project:'项目',
  start:'起始时间', due:'预计交付日期', actual:'实际交付日期', progress:'进度',
  deliverable:'交付成果', version:'版本号', related:'主任务', feedback:'反馈意见',
  difficulty:'难点和动作', owner:'负责人', status:'状态', url:'分享链接'
};
/* 对比两个对象，产出字段级变更数组 [{field, from, to}] */
function diffTask(oldT, newT, keys){
  if(!keys) keys = Object.keys(LOG_FIELD_LABELS);
  const changes = [];
  keys.forEach(k=>{
    const a = oldT && oldT[k]==null ? '' : (oldT? String(oldT[k]) : '');
    const b = newT && newT[k]==null ? '' : (newT? String(newT[k]) : '');
    if(a!==b) changes.push({field:k, from:a, to:b});
  });
  return changes;
}
function addLog(action, targetType, targetId, targetName, projectName, changes, summary){
  state.logs.unshift({
    id:uid(), ts:nowISO(), action,
    targetType: targetType||'task',
    targetId: targetId||'',
    targetName: targetName||'',
    projectName: projectName||'',
    changes: changes||[],
    summary: summary||''
  });
  save();
}
/* 新建类操作：把新对象的关键字段拍成「（空）→ 值」快照，便于打开卡片查看新增内容 */
const ADD_SNAPSHOT_FIELDS = ['type','project','start','due','actual','status','progress','version','owner','deliverable','feedback','difficulty'];
function snapshotFields(obj, fields){
  const out = [];
  (fields||Object.keys(LOG_FIELD_LABELS)).forEach(f=>{
    const v = obj[f]==null ? '' : String(obj[f]);
    if(v!=='') out.push({field:f, from:'', to:v});
  });
  return out;
}

function setMain(html){ document.getElementById('main').innerHTML = '<div class="view-enter">' + html + '</div>'; }
function pageHeader(num, titleZh, titleEn, meta){
  return `<header class="page-header">
    <div>
      <div class="ph-issue">№${num} — ${esc(titleZh)} / ${esc(titleEn)}</div>
      <h1 class="ph-title">${esc(titleZh)}</h1>
      <div class="ph-meta">${esc(meta)}</div>
    </div>
    <div class="ph-right">
      <div class="ph-num">${num}</div>
      <div class="ph-mark">● · WORKBENCH</div>
    </div>
  </header>`;
}
/* ============ 路由 ============ */

/* ============ Roadmap 子导航（项目列表） ============ */
function renderProjectNav(){
  const ul = $('#projectList');
  let html = '';
  state.projectOrder.forEach(p=>{
    html += `<li data-p="${esc(p)}" class="${state.currentProject===p?'active':''}" draggable="true">
      <span class="grip">⠿</span>${esc(p)}</li>`;
  });
  html += `<li class="proj-add" data-add="1"><span class="grip" style="visibility:hidden">⠿</span>＋ 新建项目</li>`;
  ul.innerHTML = html;
  ul.querySelectorAll('li[data-p]').forEach(li=>{
    li.addEventListener('click',e=>{ if(e.target.classList.contains('grip'))return; go('roadmap', li.dataset.p); });
    li.addEventListener('dragstart',e=>{ li.classList.add('dragging'); e.dataTransfer.setData('text', li.dataset.p); });
    li.addEventListener('dragover',e=>e.preventDefault());
    li.addEventListener('drop',e=>{
      e.preventDefault(); li.classList.remove('dragging');
      const from = e.dataTransfer.getData('text'); const to = li.dataset.p;
      if(from && to && from!==to){
        const arr=state.projectOrder; const i=arr.indexOf(from), j=arr.indexOf(to);
        arr.splice(i,1); arr.splice(j,0,from); save(); renderProjectNav();
      }
    });
    li.addEventListener('contextmenu',e=>{ e.preventDefault(); showProjectMenu(e.clientX, e.clientY, li.dataset.p); });
  });
  ul.querySelector('li[data-add]').addEventListener('click',e=>{ e.stopPropagation(); openAddProject(); });
}

  state.projectOrder.push(name);

function openRenameProject(old){
  const html = `<h3>重命名项目</h3>
    <div class="field"><label>项目名称 *</label><input id="rp_name" value="${esc(old)}" autocomplete="off"></div>

      <button class="btn ok sm" id="rpSave">保存</button>
    </div>`;
  openModal(html);
  const inp=$('#rp_name'); inp.focus(); inp.select();
  const submit=()=>{ const v=inp.value; closeModal(); renameProject(old, v); };
  $('#rpCancel').addEventListener('click',closeModal);
  $('#rpSave').addEventListener('click',submit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
}
function renameProject(old, raw){
  const name=(raw||'').trim();
  if(!name || name===old) return;
  if(state.projectOrder.includes(name)){
    if(!confirm(`项目「${name}」已存在，将把「${old}」的任务与文件并入「${name}」，并删除「${old}」？`)) return;
    state.tasks.forEach(t=>{ if(t.project===old) t.project=name; });
    state.files.forEach(f=>{ if(f.project===old) f.project=name; });
    state.projectOrder = state.projectOrder.filter(p=>p!==old);
    if(state.currentProject===old) state.currentProject=name;
    addLog('update', 'project', '', `《${old}》`, old, [{field:'project',from:old,to:name}], `项目《${old}》并入《${name}》`);
  } else {
    const i = state.projectOrder.indexOf(old);
    if(i>=0) state.projectOrder[i]=name;
    state.tasks.forEach(t=>{ if(t.project===old) t.project=name; });
    state.files.forEach(f=>{ if(f.project===old) f.project=name; });
    if(state.currentProject===old) state.currentProject=name;
    addLog('update', 'project', '', `《${old}》`, old, [{field:'project',from:old,to:name}], `项目《${old}》重命名为《${name}》`);
  }
  save(); render();
}
function deleteProject(name){
  const n = state.tasks.filter(t=>t.project===name).length;
  const m = state.files.filter(f=>f.project===name).length;
  let msg = `确认删除项目「${name}」？`;
  if(n||m) msg += `\n该项目下还有 ${n} 条任务、${m} 个文件，将一并删除且不可恢复。`;
  if(!confirm(msg)) return;
  state.projectOrder = state.projectOrder.filter(p=>p!==name);
  if(n) state.tasks = state.tasks.filter(t=>t.project!==name);
  if(m) state.files = state.files.filter(f=>f.project!==name);
  if(state.currentProject===name) state.currentProject='all';
  addLog('delete', 'project', '', `《${name}》`, name, [], `删除项目《${name}》${n||m?`（含 ${n} 任务 / ${m} 文件）`:''}`);
  save(); render();
}

/* ============ 指标卡详情弹窗 ============ */
function openMetricDetail(type, ctx){
  const {wk} = ctx;
  const titles = {total:'本周任务总数', done:'本周已交付', doing:'本周进行中', undone:'本周未开始'};
  const statusMap = {total:null, done:'已交付', doing:'进行中', undone:'未开始'};
  const title = titles[type] || '详情';
  /* 筛选任务 */
  let tasks = wk.slice();
  if(statusMap[type]) tasks = tasks.filter(t=> t.status===statusMap[type]);
  /* 按项目分组 */
  const byProj = {};
  tasks.forEach(t=>{ const p=t.project||'未分配'; (byProj[p]=byProj[p]||[]).push(t); });
  /* 任务条渲染函数 */
  const taskRow = (t, opts={})=>{
    const showActual = opts.showActual || false;
    const showDeliverable = opts.showDeliverable || false;
    const fields = [];
    fields.push(`<span class="dt-name">${esc(t.name)}</span>`);
    if(opts.showReq && t.requirement) fields.push(`<span class="dt-req">${esc(t.requirement)}</span>`);
    if(showDeliverable && t.deliverable) fields.push(`<span class="dt-del">${esc(t.deliverable)}</span>`);
    fields.push(`<span class="dt-date">${esc(t.start||'—')}</span>`);
    fields.push(`<span class="dt-date">${esc(t.due||'—')}</span>`);
    if(showActual) fields.push(`<span class="dt-date dt-actual">${esc(t.actual||'—')}</span>`);
    return `<div class="dt-row" data-id="${t.id}">${fields.join('')}</div>`;
  };
  /* 构建内容 */
  let body = '';
  if(type==='total'){
    /* 总数：按状态分组，每组内按项目分组 */
    ['未开始','进行中','已交付'].forEach(st=>{
      const stTasks = tasks.filter(t=>t.status===st);
      if(!stTasks.length) return;
      const stByProj = {};
      stTasks.forEach(t=>{ const p=t.project||'未分配'; (stByProj[p]=stByProj[p]||[]).push(t); });
      body += `<div class="dt-section"><div class="dt-st-header"><span class="dot d-${st}"></span><b>${st}</b> · ${stTasks.length} 条</div>`;
      Object.entries(stByProj).forEach(([proj,ts])=>{
        body += `<div class="dt-proj-group"><div class="dt-proj-name">📂 ${esc(proj)}</div>${ts.map(t=>taskRow(t,{showReq:true,showActual:st==='已交付'})).join('')}</div>`;
      });
      body += `</div>`;
    });
  } else {
    /* 已交付/进行中/未开始：按项目分组 */
    if(!tasks.length){ body = '<p class="muted" style="padding:16px;text-center">暂无数据</p>'; }
    else {
      Object.entries(byProj).forEach(([proj,ts])=>{
        body += `<div class="dt-section"><div class="dt-proj-name">📂 ${esc(proj)} · ${ts.length} 条</div>`;
        body += ts.map(t=>taskRow(t,{
          showReq: type!=='done',
          showDeliverable: type==='done',
          showActual: type==='done'
        })).join('');
        body += `</div>`;
      });
    }
  }
  /* 表头 */
  let headerRow = '';
  if(type==='total'){
    headerRow = `<div class="dt-head"><span>任务名称</span><span>任务要求</span><span>起始</span><span>预计交付</span><span>实际交付</span></div>`;
  } else if(type==='done'){
    headerRow = `<div class="dt-head"><span>任务名称</span><span>交付成果</span><span>起始</span><span>预计交付</span><span>实际交付</span></div>`;
  } else {
    headerRow = `<div class="dt-head"><span>任务名称</span><span>任务要求</span><span>起始</span><span>预计交付</span></div>`;
  }

  const html = `<h3>${title} · ${tasks.length} 条任务</h3>
    <div class="dt-table">${headerRow}${body}</div>
    <div style="text-align:right;margin-top:12px">
      <button class="btn ghost sm" id="dtClose">关闭</button>
    </div>`;
  openModal(html, true);
  $('#dtClose').addEventListener('click', closeModal);
  /* 点击任务行 → 跳转到该任务的看板（如果有的话） */
  document.querySelectorAll('.dt-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const tid = row.dataset.id;
      const task = state.tasks.find(x=>x.id===tid);
      if(task && task.project){ goToTask(task.id); }
    });
    row.style.cursor='pointer';
  });
}

/* ============ 快速录入：自动识别 ============ */
function parseQuick(text){
  const t = text;
  let project='', type='', start='', due='', name=t, requirement='';
  // 任务要求：提取"要求/需求/备注：xxx"
  const reqM = t.match(/(要求|需求|备注)[：:]\s*([^，。；;]+)/);
  if(reqM){ requirement = reqM[2].trim(); }
  // 项目（含别名归一）
  let rawProj='';
  ['招商局','特发集团','特发','高新投','高薪投','平安产险','中国平安'].forEach(p=>{ if(t.includes(p)) rawProj=p; });
  if(rawProj) project = normalizeProject(rawProj);
  // 任务类型（显式提及 调研类/文案撰写类…）
  getTypes().forEach(tp=>{ if(t.includes(tp)) type=tp; });
  if(!type) type = detectType(t);
  // 日期（约束月/日范围，避免误吞数值区间）
  const dates = extractDates(t);
  if(dates.length>=1) start = dates[0];
  if(dates.length>=2) due = dates[1];
  // 关键词修正：预计/交付 后的日期作 due；启动/起始 后的作 start
  const dueM = t.match(new RegExp('(?:预计|交付)\\s*'+MD_SRC));
  if(dueM){ const mm=dueM[0].match(new RegExp(MD_SRC)); if(mm) due=`${YEAR}-${String(+mm[1]).padStart(2,'0')}-${String(+mm[2]).padStart(2,'0')}`; }
  const startM = t.match(new RegExp('(?:启动|起始|开始)\\s*'+MD_SRC));
  if(startM){ const mm=startM[0].match(new RegExp(MD_SRC)); if(mm) start=`${YEAR}-${String(+mm[1]).padStart(2,'0')}-${String(+mm[2]).padStart(2,'0')}`; }
  // 任务名称：去掉已识别的日期、项目、类型词、要求片段
  name = cleanDates(t)
            .replace(/(要求|需求|备注)[：:][^，。；;]+/g,'')
            .replace(/招商局|特发集团|特发|高新投|高薪投|平安产险|中国平安/g,'')
            .replace(/调研类|文案撰写类|文案宣传类|设计类|执行协调类|其他/g,'')
            .replace(/预计|交付|启动|起始|开始/g,'').replace(/\s+/g,'').trim();
  if(!name) name = t.slice(0,30);
  return {project,type,start,due,name,requirement};
}
function baseNameOf(c){ return (c||'').replace(/\s*[vV]\d+\s*$/,'').trim(); }
function verNumOf(v){ const m=(v||'').match(/[vV](\d+)/); return m? +m[1] : 0; }
function nextVersionFor(content){
  const base = baseNameOf(content);
  const vers = state.tasks.filter(t=> baseNameOf(t.name)===base).map(t=> verNumOf(t.version));
  return 'v'+(vers.length? (Math.max(...vers)+1) : 1);
}
function openQuickPreview(text, preset){
  const p = parseQuick(text||'');
  /* baseNameOf 仅用于匹配已有任务组（判断版本归属），不截断用户原始输入 */

  const presetRel = (preset&&preset.related)||'';
  const presetProj = (preset&&preset.project)||'';
  const presetTask = presetRel ? state.tasks.find(x=>x.id===presetRel) : null;
  let relL1Sel = presetRel ? topAncestorId(presetRel) : '';
  let relL2Sel = (presetTask && presetTask.related && presetTask.related!==relL1Sel) ? presetTask.related : '';
  const projOpts = projects().map(pr=>`<option ${pr===presetProj?'selected':''}>${esc(pr)}</option>`).join('');
  const typePicker = softSelectHTML('f_type', getTypes(), p.type);
  const html = `<h3>识别结果 · 请确认</h3>
    <div class="hint" style="margin-bottom:10px">${matchHint}</div>
    <div class="field"><label>任务名称 <span class="req">*</span></label><input id="f_name" value="${esc(rawName)}"></div>
    <div class="field"><label>任务要求</label><input id="f_req" value="${esc(p.requirement)}" placeholder="具体要求、备注等"></div>
    <div class="field"><label>任务类型 <span class="req">*</span></label><div style="display:flex;gap:8px;align-items:center"><div style="flex:1">${typePicker}</div><button class="btn sm ghost" id="f_editType" type="button">编辑类型</button></div></div>

  if(presetProj){ rebL1(); } else { $('#relL1').innerHTML='<option value="">— 请先选择项目</option>'; $('#relL2Wrap').style.display='none'; }
  updateNote();

    const name=$m('#f_name').value.trim();
    const requirement=$m('#f_req').value.trim();
    const type=$m('#f_type').value;
    const start=$m('#f_start').value;
    const due=$m('#f_due').value;
    if(!name||!type||!start||!due){ alert('必填：任务名称、任务类型、起始时间、预计交付日期'); return; }
    const relId=effRel;
    const par=relId?state.tasks.find(x=>x.id===relId):null;
    let project=projSel.value;
    if(par && par.project) project=par.project;   // 子任务跟随母任务项目
    if(!project){ alert('请选择项目（或先为母任务指定项目）'); return; }
